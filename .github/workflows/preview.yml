# Publishes a playable build of the game to GitHub Pages.
#
#   main            -> https://<owner>.github.io/<repo>/
#   pull request N  -> https://<owner>.github.io/<repo>/pr/N/
#
# Everything lives on one `gh-pages` branch, each target in its own directory,
# so a PR preview never clobbers main. Closing a PR removes its directory.
#
# Nothing is published until `npm test` passes, so a preview link always points
# at a build whose levels still solve and whose physics fingerprint is intact.
#
# One-time setup: Settings -> Pages -> Source = "Deploy from a branch",
# branch `gh-pages`, folder `/ (root)`.
name: Preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Every job pushes to the same branch, so they must not interleave.
concurrency:
  group: preview-pages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # The gate. Runs for forks too — they get test feedback even though they
  # cannot publish. Skipped when a pull request closes, since that path only
  # deletes a directory and there is nothing to verify.
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Level solvability, mesh/dynamics invariants, real-mouse interaction, and
      # the physics fingerprint that keeps presentation changes presentation-only.
      - name: npm test
        run: npm test

  preview:
    needs: test
    # Publish only behind a green suite. `always()` is needed so the job still
    # runs when `test` was skipped (a closing pull request, which just cleans
    # up) — a failed or cancelled `test` still blocks it.
    # A pull request from a fork gets a read-only token and cannot publish.
    if: >-
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # For an open PR this is the merge result, which is what a reviewer
      # actually wants to try. For a closed one the head may be gone, so fall
      # back to the default branch — we only need a repo to push from.
      - name: Check out the build being previewed
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the default branch
        if: github.event.action == 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Work out where this build is published
        id: target
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            echo "dir=pr/$NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi
          # Pages serves the owner segment lowercased; the repo segment keeps its case.
          LOWER_OWNER=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "url=https://$LOWER_OWNER.github.io/$REPO" >> "$GITHUB_OUTPUT"

      - name: Publish to gh-pages
        env:
          DIR: ${{ steps.target.outputs.dir }}
          CLOSED: ${{ github.event.action == 'closed' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Attach the published site as a worktree, creating it on first run.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --no-tags origin gh-pages
            git worktree add site origin/gh-pages
            git -C site checkout -B gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf . >/dev/null 2>&1 || true
          fi

          if [ "$CLOSED" = "true" ]; then
            # Only ever delete a pr/N directory — never the published main site.
            case "$DIR" in
              pr/[0-9]*) rm -rf "site/$DIR" ;;
              *) echo "refusing to remove '$DIR'"; exit 1 ;;
            esac
            MSG="preview: remove $DIR (pull request closed)"
          else
            mkdir -p "site/$DIR"
            # The game is one self-contained file; index.html makes the URL clean.
            cp gear_works.html "site/$DIR/index.html"
            cp gear_works.html "site/$DIR/gear_works.html"
            MSG="preview: publish $DIR from ${GITHUB_SHA::7}"
          fi

          touch site/.nojekyll   # serve files verbatim, no Jekyll pass

          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "site unchanged, nothing to push"
          else
            git commit -m "$MSG"
            git push origin HEAD:gh-pages
          fi

      - name: Comment the preview link on the pull request
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.target.outputs.url }}/${{ steps.target.outputs.dir }}/
          MAIN_URL: ${{ steps.target.outputs.url }}/
        with:
          script: |
            const marker = '<!-- gear-works-preview -->';
            const body = [
              marker,
              '### ▶ Live preview',
              '',
              `**[Play this build](${process.env.PREVIEW_URL})** — rebuilt from \`${context.sha.slice(0, 7)}\`.`,
              '',
              `Main branch: ${process.env.MAIN_URL}`,
              '',
              'Pointer and touch input both work in the hosted build; the page is a single',
              'self-contained file, so it needs no network access once loaded.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            // One sticky comment that gets edited, rather than a new one per push.
            const mine = existing.find((c) => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
