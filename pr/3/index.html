/* ==========================================================================
   DESIGN TOKENS — "Machined Instrument" (mirrors the `T` object in JS)
   ========================================================================== */
:root{
  /* chassis */
  --void:#06080B; --field:#0B0E14; --field-hi:#141A24;
  --panel:#111621; --panel-hi:#1A2130;
  --keycap:#1C2432; --keycap-hi:#273142;
  --groove:#05070A; --edge:#2A3446; --edge-hi:#43526E;
  /* ink */
  --ink:#EAF0FA; --ink-2:#A2B0C6; --ink-3:#8B98B0; --ink-4:#46536A;
  /* signal */
  --amber:#FFB020; --amber-hi:#FFD98A; --amber-dim:#6E4B10;
  --cyan:#5FD9FF; --cyan-hi:#B7EEFF; --cyan-dim:#17546B;
  --green:#4BE39B; --red:#FF6252;
  /* space / radius */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --r-1:3px; --r-2:6px; --r-3:10px; --r-4:14px; --r-pill:999px;
  /* type */
  --fs-micro:10px; --fs-caption:11px; --fs-label:12px; --fs-body-sm:13px;
  --fs-body:15px; --fs-subhead:18px; --fs-title:24px; --fs-display-sm:34px; --fs-display:48px;
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* elevation */
  --e-inset:inset 0 1px 0 rgba(255,255,255,.045), inset 0 -1px 0 rgba(0,0,0,.5);
  --e-1:inset 0 1px 0 rgba(255,255,255,.05), 0 10px 28px -14px rgba(0,0,0,.9);
  --e-2:inset 0 1px 0 rgba(255,255,255,.07), 0 2px 4px rgba(0,0,0,.5);
  --e-3:0 32px 80px -24px rgba(0,0,0,.92);
  --glow-amber:0 0 0 1px rgba(255,176,32,.55), 0 0 18px -2px rgba(255,176,32,.35);
  --glow-cyan:0 0 0 1px rgba(95,217,255,.45), 0 0 16px -2px rgba(95,217,255,.30);
  /* motion */
  --d-1:90ms; --d-2:160ms; --d-3:260ms; --d-4:420ms;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-inout:cubic-bezier(.65,0,.35,1);
  --ease-press:cubic-bezier(.4,0,1,1);
  /* layout */
  --rail-w:176px; --topbar-h:52px;
}

/* ==========================================================================
   BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--void);
  font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
#c{display:block;position:absolute;inset:0;touch-action:none;cursor:crosshair}

/* the chrome layer: transparent to pointers except on real controls */
#ui{position:absolute;inset:0;pointer-events:none;z-index:2;
  font-family:var(--sans);font-size:var(--fs-body-sm);line-height:1.35}
#ui > *{pointer-events:none}
#ui button,#ui .interactive{pointer-events:auto}
/* Anything faded out must also stop swallowing pointers. `visibility` carries a
   transition delay, so hit-testing is switched off by pointer-events instead —
   at ID specificity, otherwise `#ui button` wins and invisible controls keep
   eating clicks meant for the bench underneath. */
#ui .screen:not(.on),
#ui .screen:not(.on) button{pointer-events:none}
body[data-mode="menu"] #rail,
body[data-mode="menu"] #topbar,
body[data-mode="menu"] #hintbar,
body[data-mode="menu"] #rail button,
body[data-mode="menu"] #topbar button{pointer-events:none}

/* ==========================================================================
   PRIMITIVES — panel / keycap button / chip / meter
   Every screen is built from these three, so new surfaces inherit the style.
   ========================================================================== */
.panel{
  background:linear-gradient(180deg,var(--panel-hi),var(--panel));
  border:1px solid var(--edge);
  border-radius:var(--r-3);
  box-shadow:var(--e-1);
  position:relative;
}
/* the milled highlight that catches the light on every top edge */
.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;border-radius:var(--r-3) var(--r-3) 0 0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10) 18%,rgba(255,255,255,.10) 82%,transparent)}

.eyebrow{font-size:var(--fs-micro);font-weight:600;letter-spacing:.10em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:var(--sp-2)}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}

.btn{
  --btn-face:var(--keycap); --btn-face-hi:var(--keycap-hi); --btn-ink:var(--ink-2);
  display:flex;align-items:center;gap:var(--sp-2);
  min-height:36px;padding:0 var(--sp-3);
  font-family:var(--sans);font-size:var(--fs-label);font-weight:600;letter-spacing:.02em;
  color:var(--btn-ink);
  background:linear-gradient(180deg,var(--btn-face-hi),var(--btn-face));
  border:1px solid var(--edge);border-radius:var(--r-2);
  box-shadow:var(--e-2);
  cursor:pointer;user-select:none;appearance:none;
  transition:background var(--d-2) var(--ease-out),color var(--d-2) var(--ease-out),
             border-color var(--d-2) var(--ease-out),box-shadow var(--d-2) var(--ease-out),
             transform var(--d-1) var(--ease-press);
}
.btn:hover:not(:disabled){--btn-ink:var(--ink);border-color:var(--edge-hi);
  background:linear-gradient(180deg,#2E3A4E,#212A39)}
.btn:active:not(:disabled){transform:translateY(1px);
  background:linear-gradient(180deg,#161C27,#1B2230);
  box-shadow:var(--e-inset)}
.btn:focus-visible{outline:none;box-shadow:var(--e-2),0 0 0 2px var(--void),0 0 0 4px var(--cyan)}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;
  background:linear-gradient(180deg,#161B25,#131822);--btn-ink:var(--ink-4)}
.btn .ico{flex:0 0 auto;width:18px;height:18px;color:var(--ink-3);transition:color var(--d-2) var(--ease-out)}
.btn:hover:not(:disabled) .ico{color:var(--ink-2)}
.btn .lbl{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn .val{font-family:var(--mono);font-size:var(--fs-caption);font-weight:500;color:var(--amber-hi)}
/* selected / latched control: amber authority */
.btn[aria-pressed="true"]{--btn-ink:var(--amber-hi);border-color:rgba(255,176,32,.42);
  background:linear-gradient(180deg,#33270F,#241B0A);box-shadow:var(--e-2),inset 0 0 0 1px rgba(255,176,32,.12)}
.btn[aria-pressed="true"] .ico{color:var(--amber)}
/* primary action */
.btn.primary{--btn-ink:#0A0C10;border-color:rgba(255,176,32,.5);
  background:linear-gradient(180deg,var(--amber-hi),var(--amber));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 10px -3px rgba(255,176,32,.55)}
.btn.primary:hover{background:linear-gradient(180deg,#FFE4A8,#FFBF44)}
.btn.primary .ico{color:rgba(10,12,16,.62)}

.chip{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;
  font-size:var(--fs-micro);font-weight:600;letter-spacing:.10em;text-transform:uppercase;
  color:var(--ink-3);background:rgba(255,255,255,.03);
  border:1px solid var(--edge);border-radius:var(--r-1)}
.chip.amber{color:var(--amber-hi);border-color:rgba(255,176,32,.32);background:rgba(255,176,32,.08)}
.chip.cyan{color:var(--cyan-hi);border-color:rgba(95,217,255,.28);background:rgba(95,217,255,.07)}
.chip.green{color:var(--green);border-color:rgba(75,227,155,.30);background:rgba(75,227,155,.08)}

/* an instrument read-out cell: micro label above a mono value */
.meter{display:flex;flex-direction:column;gap:1px;min-width:0}
.meter .k{font-size:var(--fs-micro);font-weight:600;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-3)}
.meter .v{font-family:var(--mono);font-size:var(--fs-body-sm);font-weight:500;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.meter .v.amber{color:var(--amber-hi)}
.meter .v.cyan{color:var(--cyan-hi)}
.meter .v.dim{color:var(--ink-3)}
.lamp{width:7px;height:7px;border-radius:50%;flex:0 0 auto;
  background:var(--green);box-shadow:0 0 8px -1px var(--green);
  transition:background var(--d-2),box-shadow var(--d-2)}

/* ==========================================================================
   IN-GAME CHROME
   ========================================================================== */
#topbar{position:absolute;top:var(--sp-3);left:calc(var(--rail-w) + var(--sp-5));right:var(--sp-3);
  height:var(--topbar-h);display:flex;align-items:center;gap:var(--sp-4);
  padding:0 var(--sp-4);overflow:hidden;
  background:linear-gradient(180deg,rgba(26,33,48,.92),rgba(17,22,33,.92));

#topbar .title{display:flex;align-items:center;gap:var(--sp-3);min-width:0}
#topbar .title .name{font-size:var(--fs-body);font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#rail{position:absolute;top:var(--sp-3);left:var(--sp-3);bottom:var(--sp-3);width:var(--rail-w);
  display:flex;flex-direction:column;gap:var(--sp-3);padding:var(--sp-3);
  background:linear-gradient(180deg,rgba(26,33,48,.94),rgba(15,19,29,.94));

#rail .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
/* level briefing — fills the puzzle rail with the thing the player needs */
#brief{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-3);
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0));
  border:1px solid var(--edge);border-radius:var(--r-2);box-shadow:var(--e-inset)}

#brief .hint{font-size:var(--fs-caption);color:var(--ink-3);line-height:1.45}
#brief .row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}

#brief .goals{display:flex;flex-direction:column;gap:5px}

  font-size:var(--fs-micro);letter-spacing:.06em;color:var(--ink-3)}

#brief .goal.done .dot{background:var(--green);border-color:var(--green)}
/* over par is information, not a failure: the level is still winnable, for less */
#tray .s.over{color:var(--amber)}

/* parts-tray tile: icon over a micro caption */
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:46px;padding:0;

  color:var(--ink-3);

.stepper button:last-child{border-left:1px solid var(--edge)}

  background:linear-gradient(180deg,#0D111A,#0A0E15)}
.stepper .read b{font-family:var(--mono);font-size:var(--fs-body-sm);font-weight:600;color:var(--amber-hi);
  font-variant-numeric:tabular-nums;line-height:1.1}

/* the scrap tray: fills the rail's dead space AND is the drop-to-delete target */
#tray{flex:1 1 auto;min-height:56px;max-height:210px;margin-top:auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;text-align:center;padding:var(--sp-3);
  border:1px dashed var(--edge);border-radius:var(--r-2);color:var(--ink-2);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.014) 0 6px,transparent 6px 12px)}

#tray .t{font-size:var(--fs-micro);font-weight:600;letter-spacing:.10em;text-transform:uppercase}
#tray .s{font-size:var(--fs-caption);color:var(--ink-3);line-height:1.45;max-width:16ch}
#tray.count{flex:0 0 auto;max-height:none;border-style:solid;border-color:var(--edge);
  background:var(--groove);box-shadow:var(--e-inset);color:var(--ink-3);gap:2px;padding:var(--sp-3)}
#tray.count .s{font-family:var(--mono);font-size:var(--fs-body);font-weight:500;color:var(--ink);

#tray.armed{border-color:var(--red);color:var(--red);background:rgba(255,98,82,.06)}

#hintbar{position:absolute;left:calc(var(--rail-w) + var(--sp-5));bottom:var(--sp-3);right:var(--sp-3);
  display:flex;align-items:center;gap:var(--sp-2) var(--sp-4);flex-wrap:wrap;

  color:var(--ink-2);background:linear-gradient(180deg,var(--keycap-hi),var(--keycap));
  border:1px solid var(--edge);border-bottom-color:var(--groove);border-radius:var(--r-1);

body[data-mode="free"] #topbar,body[data-mode="free"] #rail,body[data-mode="free"] #hintbar,

/* ==========================================================================

.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:var(--sp-5);overflow:auto;
  opacity:0;visibility:hidden;transition:opacity var(--d-4) var(--ease-out),visibility 0s linear var(--d-4)}
.screen.on{opacity:1;visibility:visible;transition-delay:0s}
.screen .stack{width:min(460px,100%);display:flex;flex-direction:column;gap:var(--sp-4)}
.screen .stack > *{opacity:0;transform:translateY(8px);
  transition:opacity var(--d-4) var(--ease-out),transform var(--d-4) var(--ease-out)}

/* The chrome layer is pointer-events:none with only buttons opting back in, which
   left the level list unscrollable — the wheel fell through to the canvas and
   zoomed the board instead. The title screen takes the pointer while it is up;
   there is nothing behind it to interact with. #winscreen deliberately does NOT
   (the board stays live under the completion sheet). */
#title.on{pointer-events:auto}
#title{background:radial-gradient(120% 90% at 50% 0%,rgba(20,26,36,.85),rgba(6,8,11,.94))}

#title h1{margin:0;font-size:var(--fs-display);font-weight:700;letter-spacing:-.01em;line-height:1.08;
  display:flex;align-items:baseline;gap:.28em}
#title h1 span{color:var(--ink-3);font-weight:400}
#title .tagline{margin:0;font-size:var(--fs-body-sm);color:var(--ink-3);max-width:34ch}

.level-row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.level-row .txt b{font-size:var(--fs-body-sm);font-weight:600;color:var(--ink);letter-spacing:.01em}
.level-row .txt small{font-size:var(--fs-caption);color:var(--ink-3);white-space:nowrap;overflow:hidden;

  background:linear-gradient(180deg,rgba(6,8,11,0) 58%,rgba(6,8,11,.30) 82%,rgba(6,8,11,.62) 100%);
  pointer-events:none}

  right:var(--sp-3);bottom:var(--sp-3);gap:0}

  padding:var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4);border-radius:var(--r-3);

  border-radius:var(--r-3) var(--r-3) 0 0;
  background:linear-gradient(90deg,transparent,rgba(75,227,155,.55),transparent)}

  filter:drop-shadow(0 4px 16px rgba(75,227,155,.3))}
#winscreen .head{display:flex;flex-direction:column;gap:2px;min-width:0}
#winscreen h2{margin:0;font-size:var(--fs-label);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--green)}
#winscreen .lv{font-size:var(--fs-body);font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#winscreen .stats{display:flex;align-items:center;gap:var(--sp-4);margin-left:auto}
#winscreen .stars{display:flex;gap:3px}
#winscreen .stars .st{width:19px;height:19px;color:var(--ink-4)}
#winscreen .stars .st.on{color:var(--amber);filter:drop-shadow(0 1px 6px rgba(255,176,32,.45))}
#winscreen .stats .v{font-size:var(--fs-body);font-weight:600}
#winscreen .acts{display:flex;gap:var(--sp-2);flex:0 0 auto}

       tapped but never dragged. It takes the pointer here. Starting a gear drag

  #rail .group .eyebrow{display:none}
  #rail .tray{display:flex;gap:6px}
  #rail .row2{display:flex;gap:6px}
  .tile{width:52px;height:52px;flex:0 0 52px}
  .btn{min-height:52px;padding:0 var(--sp-3)}

  .stepper .read{padding:0 var(--sp-3)}
  #topbar .lo{display:none}

  #brief{display:none}

  #winscreen .card{flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);padding:var(--sp-3)}
  #winscreen .stats{margin-left:auto;order:2}

/* --- motion: entrance stagger, value flash, paused state --- */
#rail .group,#rail #tray,#rail > .btn{opacity:0;transform:translateX(-6px);
  transition:opacity var(--d-3) var(--ease-out),transform var(--d-3) var(--ease-out)}

body[data-mode="puzzle"] #rail .group,body[data-mode="puzzle"] #rail #tray,body[data-mode="puzzle"] #rail > .btn{
  opacity:1;transform:none}
#rail > *:nth-child(1){transition-delay:20ms}
#rail > *:nth-child(2){transition-delay:56ms}
#rail > *:nth-child(3){transition-delay:92ms}

#rail > *:nth-child(5){transition-delay:164ms}

@keyframes valueFlash{
  0%{color:var(--amber);text-shadow:0 0 12px rgba(255,176,32,.55)}
  100%{color:inherit;text-shadow:none}
}

@keyframes sealIn{
  from{opacity:0;transform:scale(.82) rotate(-14deg)}
  to{opacity:1;transform:none}
}

/* The sheet rises as one piece. A per-button staggered animation used to live
   here and it was a bug: the buttons are created in the same frame the sheet is
   revealed, and the animation sat in its delay phase holding `from` (opacity 0)
   instead of running — the actions were invisible but still clickable, which is
   the worst of both. The card's own entrance is the whole effect now. */

/* the sheet seats upward from the bottom edge, like a drawer, not a fading card */
#winscreen .stack > *{transform:translateY(20px)}
/* the hint strip steps out of the way rather than being covered by the sheet */

body[data-paused="1"] #topbar{border-color:rgba(255,176,32,.38);
  box-shadow:var(--e-1),inset 3px 0 0 var(--amber)}

/* mobile: a fade at the dock's scrolling edge so it reads as scrollable */
#railfade{display:none;position:absolute;pointer-events:none;transition:opacity 140ms ease;
  background:linear-gradient(90deg,rgba(11,14,20,0),rgba(11,14,20,.92))}

  #railfade{display:block;right:var(--sp-2);bottom:var(--sp-2);width:52px;
    height:calc(52px + 2 * var(--sp-2));border-radius:0 var(--r-3) var(--r-3) 0;
    background:linear-gradient(90deg,rgba(13,17,26,0),rgba(13,17,26,.55) 45%,rgba(13,17,26,.97))}

// hex -> {r,g,b} 0..255, memoised (draw path must not allocate per frame)
const _hexCache = new Map();
function hexRGB(hex) {
  let v = _hexCache.get(hex);
  if (v) return v;
  const n = parseInt(hex.slice(1), 16);
  v = { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  _hexCache.set(hex, v);
  return v;
}
const _rgbaCache = new Map();
// "#RRGGBB" + alpha -> css rgba() string, memoised
function ca(hex, a) {
  const key = a === undefined ? hex : hex + "|" + a;
  let s = _rgbaCache.get(key);
  if (s) return s;
  const c = hexRGB(hex);
  s = a === undefined || a >= 1 ? hex : "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
  _rgbaCache.set(key, s);
  return s;
}
// Multiply a hex toward black/white — the machined facet derivation.
const _shadeCache = new Map();
function shadeHex(hex, mult) {
  const key = hex + "*" + mult;
  let s = _shadeCache.get(key);
  if (s) return s;
  const c = hexRGB(hex);
  const f = (x) => Math.max(0, Math.min(255, Math.round(x * mult))) | 0;
  s = "#" + ((1 << 24) + (f(c.r) << 16) + (f(c.g) << 8) + f(c.b)).toString(16).slice(1);
  _shadeCache.set(key, s);
  return s;
}
// Lift a hex toward white by t (0..1) — used for the specular sweep.
const _liftCache = new Map();
function liftHex(hex, t) {
  const key = hex + "+" + t;
  let s = _liftCache.get(key);
  if (s) return s;
  const c = hexRGB(hex);
  const f = (x) => Math.round(x + (255 - x) * t) | 0;
  s = "#" + ((1 << 24) + (f(c.r) << 16) + (f(c.g) << 8) + f(c.b)).toString(16).slice(1);
  _liftCache.set(key, s);
  return s;
}

// Trace a plate outline onto the current context path (no allocation).

    ctx.moveTo(R, 0);
    ctx.arc(0, 0, R, 0, TAU);
    return;

  if (kind === "tri") {
    for (let k = 0; k < 3; k++) {
      const a = -(k * TAU / 3 + Math.PI / 2 + (rot || 0));
      const x = R * Math.cos(a), y = R * Math.sin(a);
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
  } else {
    for (let k = 0; k < 6; k++) {

      const x = R * Math.cos(a), y = R * Math.sin(a);
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);

// The amber motor badge: this gear has a servo behind it.
function paint_motor_badge(ctx, x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, TAU);
  ctx.fillStyle = ca(T.amber, 0.14); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = T.amber; ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 1; ctx.stroke();
  // a tiny bolt glyph punched out of the disc
  ctx.beginPath();
  ctx.moveTo(x + r * 0.18, y - r * 0.62);
  ctx.lineTo(x - r * 0.42, y + r * 0.10);
  ctx.lineTo(x - r * 0.02, y + r * 0.10);
  ctx.lineTo(x - r * 0.18, y + r * 0.66);
  ctx.lineTo(x + r * 0.44, y - r * 0.14);
  ctx.lineTo(x + r * 0.04, y - r * 0.14);

function triangle_vertices_from_cell(i, j, up) {
  return up ? [[i, j], [i+1, j], [i, j+1]] : [[i+1, j+1], [i+1, j], [i, j+1]];
}
function triangle_centroid_screen(i, j, up, step, origin) {
  const pts = triangle_vertices_from_cell(i, j, up);
  let sx = 0, sy = 0;
  for (const p of pts) { const s = tri_to_screen(p[0], p[1], step, origin); sx += s[0]; sy += s[1]; }
  return [sx/3, sy/3];
}
// A coiled spiral whose turns tighten as the spring winds. Direction of the coil
// follows the sign of the wind, so winding and unwinding read as opposite.
// Drawn in LOCAL canvas coords at the part centre.
function paint_spring_spiral(ctx, pitch_r, angle, wind) {
  const frac = Math.min(Math.abs(wind) / SPRING_MAX_WIND, 1);
  const turns = SPRING_TURNS_MIN + frac * (SPRING_TURNS_MAX - SPRING_TURNS_MIN);
  const dir = wind >= 0 ? 1 : -1;
  const rMin = pitch_r * 0.20, rMax = pitch_r * 0.66;
  // calm green -> hot amber -> red as the hairspring approaches its stop
  const col = frac < 0.55 ? T.green : (frac < 0.9 ? T.amber : T.red);
  const N = 150;
  // shadow pass, so the coil sits above the plate
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    for (let k = 0; k <= N; k++) {
      const f = k / N;
      const a = -(angle + dir * f * turns * TAU);
      const r = rMin + (rMax - rMin) * f;
      const x = r * Math.cos(a) + (pass ? 0 : 1), y = r * Math.sin(a) + (pass ? 0 : 1.4);
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.strokeStyle = pass ? ca(col, 0.95) : "rgba(0,0,0,0.5)";
    ctx.lineWidth = pass ? 2 : 3;
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.lineCap = "butt";
  }
  if (frac >= 0.999) {
    ctx.beginPath(); ctx.arc(0, 0, pitch_r * 0.80, 0, TAU);
    ctx.strokeStyle = ca(T.red, 0.9); ctx.lineWidth = 2.5; ctx.stroke();
  }
}

// A seized train: a red hatched disc with a fault cross. Reads as "this
// assembly can't turn", not as decoration.
function draw_lock_x(cx, cy, r) {
  const ctx = G.ctx, cyc = G.fy(cy);
  ctx.save();
  ctx.translate(cx, cyc);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, TAU);
  ctx.fillStyle = ca(T.red, 0.14); ctx.fill();
  ctx.strokeStyle = ca(T.red, 0.85); ctx.lineWidth = 2; ctx.stroke();
  const d = r * 0.30;
  ctx.beginPath();
  ctx.moveTo(-d, -d); ctx.lineTo(d, d); ctx.moveTo(-d, d); ctx.lineTo(d, -d);
  ctx.strokeStyle = ca(T.red, 0.95); ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.stroke();
  ctx.lineCap = "butt";
  ctx.restore();
}

// ============================================================
// Teeth
// ============================================================
function snap_multiple(n, m) { return m <= 1 ? n : Math.round(n/m)*m; }
function compute_teeth_from_pitch_radius(pitch_r, cp) {
  if (cp <= 1e-6) cp = 1.0;
  let z = Math.round((TAU*pitch_r)/cp);
  z = clampf(z, MIN_TEETH, MAX_TEETH);
  z = snap_multiple(z, TEETH_ROUNDING);
  if (FORCE_EVEN_TEETH && (z % 2) === 1) z = clampf(z+1, MIN_TEETH, MAX_TEETH);
  return z | 0;
}

// ============================================================
// Tiles
// ============================================================
const _PLAIN_OPTS = { spring: false };
const _SPRING_OPTS = { spring: true };
let _UID = 1;
class TileBase {
  constructor(pos, is_driver) {
    this.uid = _UID++;

    this.is_driver = !!is_driver;
    this.angle = 0; this.omega = 0; this.torque = 0; this.locked = false;
    this.drag_offset = [0, 0]; this.teeth = 14;
    this.drive_speed = rpm_to_omega(DEFAULT_DRIVE_RPM);
    this.anchored = false; this.role = null;  // "drive" | "driven"
    this.wind = 0;                            // spring gears: stored wind angle (rad)
    this.partner = null;                      // other gear on a shared shaft (stack)
    this.on_shaft_top = false;                // true = the stacked gear (rides on a base)
  }
  is_spring() { return this.label === "SP"; }
  is_rack() { return false; }
  is_ring() { return false; }
  is_stacked() { return this.partner !== null; }
  contains(p) { return dist2(this.pos, p) <= this.hit_radius()**2; }
  inertia(rp_ref) { const s = rp_ref <= 1e-9 ? 1 : this.pitch_r()/rp_ref; return INERTIA_K*s*s; }
  friction_b(rp_ref) { const s = rp_ref <= 1e-9 ? 1 : Math.pow(this.pitch_r()/rp_ref, FRICTION_B_SCALE_R); return DAMPING.friction*s; }

  // sentence about a gear train, "0.083" is not. Direction is deliberately left to
  // the rings and arrows, which cannot be misread the way a minus sign can.
  ratio_text() {
    const r = this.drive_ratio;
    if (r === null || r === undefined || !Number.isFinite(r)) return "—";
    const a = Math.abs(r);
    if (a < 1e-6) return "0";
    if (a >= 0.999 && a <= 1.001) return "1 : 1";
    if (a > 1) return (a < 9.95 ? a.toFixed(1) : Math.round(a)) + " : 1";
    const inv = 1 / a;
    return "1 : " + (inv < 9.95 ? inv.toFixed(1) : Math.round(inv));
  }
  // Text lines for this gear's floating readout (null = don't show one).
  readout_lines() {
    if (this.on_shaft_top === false && this.partner) return null;   // base of a stack: top shows it
    if (this.staged) return null;          // an unplaced part has nothing to report
    // A hand's readout is the dial it is on — and that goes for the whole shaft,
    // or the pinion riding the hand's arbor reports for it.
    if (this.hand || (this.partner && this.partner.hand)) return null;
    const rpmV = omega_to_rpm(this.omega);
    // A going train runs at fractions of an rpm, where rounding to whole numbers
    // prints "-0". Below 10 rpm the reading carries a decimal instead.
    const rpm = (Math.abs(rpmV) < 0.05 ? "0"
                 : Math.abs(rpmV) < 9.95 ? rpmV.toFixed(1) : rpmV.toFixed(0)) + " rpm";
    if (this.readout_mode === "ratio") return [this.ratio_text(), rpm];
    return [rpm, fmt_torque(this.torque)];
  }
  // Screen-up radius: how far above the centre the gear body reaches.
  readout_top() {
    if (this.is_ring && this.is_ring()) return this.outer_pr;
    if (this.label === "U1") return this.Rp_small * 1.5;

}
class HexGearTile extends TileBase {
  constructor(pos, R, is_driver, label) {
    super(pos, is_driver);
    this.label = label || "U2";
    this.set_radius(R);
  }
  set_radius(R) {
    this.R = R; const a = R*C30;
    this.Rp = 0.5*(R + a);
    this.tooth_inner_r = a;
    this.tooth_outer_r = R*(1 + TOOTH_OUTER_EXTRA_MULT);
  }
  pitch_r() { return this.Rp; }
  // Central window when stacked: reveal as much of the partner as we can, but keep
  // it inside our own window ring so our teeth/rim stay intact.
  _central_window_r() { return this.partner ? Math.min(this.Rp*0.50, Math.max(this.partner.pitch_r()*1.02, this.Rp*0.30)) : 0; }
  hit_radius() { return this.R*0.95; }
  draw() {
    const x = this.pos[0], y = this.pos[1], ctx = G.ctx;
    const base = alloy_for(this);
    // A stacked gear gets a big central window so the OTHER gear on the shaft
    // reads clearly — vital when a large gear rides on a small one.
    const extra = this.partner ? this._central_window_r() : 0;
    ctx.save();
    ctx.translate(x, G.fy(y));
    // The blank is a disc out to the root circle, so the teeth stand proud of it
    // exactly the way a cut gear does.
    paint_gear(ctx, base, this.tooth_inner_r, "disc", 0, this.Rp, this.teeth,
               this.tooth_inner_r, this.tooth_outer_r, this.angle, extra,
               this.is_spring() ? _SPRING_OPTS : _PLAIN_OPTS);
    if (this.is_spring()) paint_spring_spiral(ctx, this.Rp, this.angle, this.wind || 0);
    if (this.is_stacked()) {
      // machined shaft collar framing the central window, then the shaft pin
      ctx.beginPath(); ctx.arc(0, 0, extra, 0, TAU);
      ctx.strokeStyle = ca(liftHex(base, 0.35), 0.8); ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, extra + 2, 0, TAU);
      ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, Math.max(3, this.Rp * 0.08), 0, TAU);
      ctx.fillStyle = T.amber; ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 1; ctx.stroke();
    }
    if (this.is_driver) paint_motor_badge(ctx, -this.Rp * 0.52, this.Rp * 0.52, Math.max(4, this.Rp * 0.16));
    ctx.restore();
    if (this.locked) draw_lock_x(x, y, this.R);
    if (this.is_spring()) {
      const turns = this.wind / TAU;
      G.label((turns >= 0 ? "+" : "") + turns.toFixed(1) + " TURNS", x, y - this.R * 0.62,
              { size: 10, weight: 600, mono: true, align: "center", track: 0.08,
                color: Math.abs(turns) > 5 ? T.red : T.cyanHi, alpha: 0.95 });
    }
  }
}
class TriGearTile extends TileBase {
  constructor(pos, Rp_small, is_driver) {
    // A U1 can be a motor like anything else — tapping one in free play already
    // sets is_driver, so dropping the flag here only meant a U1 could never be
    // spawned as one (which a level's drive needs to be).
    super(pos, !!is_driver);
    this.label = "U1";
    this.set_pitch(Rp_small);
  }
  set_pitch(rp) { this.Rp_small = rp; this.tooth_inner_r = rp*0.82; this.tooth_outer_r = rp*1.12; }
  pitch_r() { return this.Rp_small; }
  // Still generous relative to the body: this is the smallest part on the board and
  // the one most often being picked up off a shaft, so the grab target does not
  // shrink just because the plate behind it did.
  hit_radius() { return this.Rp_small*1.25; }
  draw() {
    const x = this.pos[0], y = this.pos[1], ctx = G.ctx;
    ctx.save();
    ctx.translate(x, G.fy(y));
    // A disc out to the root circle, the same blank every other gear is cut from.
    // It used to be a triangular plate 1.5x the pitch radius — a leftover from the
    // hex-plate era, and the only part still wearing a shape instead of a size.
    paint_gear(ctx, alloy_for(this), this.tooth_inner_r, "disc", 0, this.Rp_small, this.teeth,
               this.tooth_inner_r, this.tooth_outer_r, this.angle, 0, _PLAIN_OPTS);
    if (this.is_driver) paint_motor_badge(ctx, 0, this.Rp_small * 0.9, Math.max(4, this.Rp_small * 0.26));
    ctx.restore();

  }

// A sliding rack: a toothed bar that converts rotation to translation.
//   v = sign(perp) * r_pinion * omega_pinion
// Its "omega" field holds the LINEAR speed (px/s) so it can ride in the same
// 1-DOF ratio solver as the gears; `s` is its displacement from `home`.
class RackTile extends TileBase {
  constructor(pos, len, dir_ang, module) {
    super(pos, false);
    this.label = "RK";
    this.home = pos.slice();
    this.dir_ang = dir_ang || 0;
    this.len = len;
    this.thick = Math.max(6, module * 3.0);
    this.module = module;
    this.s = 0;                                   // displacement along dir
    this.kinematic = false;                       // true when driven by a linkage
  }
  is_rack() { return true; }
  dir() { return [Math.cos(this.dir_ang), Math.sin(this.dir_ang)]; }
  nrm() { return [-Math.sin(this.dir_ang), Math.cos(this.dir_ang)]; }
  // The pitch lines run along the bar's two FACES (not its centreline), so a pinion
  // of radius r rides with its centre this far off the centreline:
  engage_gap(r) { return this.thick + r; }
  pitch_r() { return 0; }                          // not a circular gear
  inertia() { return RACK_MASS; }                  // plain mass (k is px/rad)
  friction_b() { return RACK_FRIC * (DAMPING.friction / FRICTION_B_PER_GEAR); }  // follows the damping preset
  sync_pos() { const u = this.dir(); this.pos = [this.home[0] + u[0]*this.s, this.home[1] + u[1]*this.s]; }
  // Local coords of a world point: [along, perpendicular]
  local(p) {
    const u = this.dir(), n = this.nrm(), dx = p[0]-this.pos[0], dy = p[1]-this.pos[1];
    return [dx*u[0] + dy*u[1], dx*n[0] + dy*n[1]];
  }
  contains(p) { const l = this.local(p); return Math.abs(l[0]) <= this.len*0.5 && Math.abs(l[1]) <= this.thick*2.2; }
  hit_radius() { return this.len*0.5; }
  draw() {
    const ctx = G.ctx, u = this.dir(), h = this.len * 0.5, th = this.thick;
    const base = T.alloyRack;
    ctx.save();
    ctx.translate(this.pos[0], G.fy(this.pos[1]));
    ctx.rotate(-this.dir_ang);
    // teeth on both faces, at the same module as the gears
    const cp = this.module * Math.PI, add = this.module * 1.05, ded = this.module * 1.30;
    const nT = Math.floor(this.len / cp), wt = cp * 0.17, wr = cp * 0.31;
    ctx.beginPath();
    for (const face of [1, -1]) {
      for (let i = 0; i <= nT; i++) {
        const d = -h + i * cp;
        if (d < -h || d > h) continue;
        const yr = -face * (th - ded), yt = -face * (th + add);
        ctx.moveTo(d - wr, yr); ctx.lineTo(d - wt, yt);
        ctx.lineTo(d + wt, yt); ctx.lineTo(d + wr, yr);
        ctx.closePath();
      }
    }
    ctx.fillStyle = shadeHex(base, 1.16); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 0.9; ctx.stroke();
    // Milled bar body with a see-through slot down the longitudinal centreline.
    // Both outlines go into one path so the slot is punched, not painted.
    ctx.beginPath();
    G.addRoundRect(-h, -th, this.len, th * 2, 3);
    const slotH = th * 0.66, slotL = this.len - th * 4;
    if (slotL > th) G.addRoundRect(-slotL / 2, -slotH / 2, slotL, slotH, slotH / 2);
    ctx.fillStyle = _gradC("RK" + _q(th), () => {
      const g = ctx.createLinearGradient(0, -th, 0, th);
      g.addColorStop(0, shadeHex(base, T.facetLight));
      g.addColorStop(0.45, base);
      g.addColorStop(1, shadeHex(base, T.facetDark));
      return g;
    });
    ctx.fill("evenodd");
    ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 1.5; ctx.stroke();
    // a lit lip along the slot's upper edge so it reads as cut through
    if (slotL > th) {
      ctx.beginPath();
      ctx.moveTo(-slotL / 2 + slotH / 2, -slotH / 2);
      ctx.lineTo(slotL / 2 - slotH / 2, -slotH / 2);
      ctx.strokeStyle = "rgba(255,255,255,0.16)"; ctx.lineWidth = 1; ctx.stroke();
    }
    // the two pitch lines the teeth stand on
    ctx.beginPath();
    ctx.moveTo(-h, -th); ctx.lineTo(h, -th); ctx.moveTo(-h, th); ctx.lineTo(h, th);
    ctx.strokeStyle = "rgba(255,255,255,0.22)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
    if (this.locked) draw_lock_x(this.pos[0], this.pos[1], th * 2);
    // travel readout, kept clear of the bar
    const nrm = this.nrm();
    G.label((this.s >= 0 ? "+" : "") + this.s.toFixed(0) + " PX" + (this.kinematic ? "  LINK" : ""),
            this.pos[0] - nrm[0] * th * 3.2, this.pos[1] - nrm[1] * th * 3.2,
            { size: 10, weight: 600, mono: true, align: "center", track: 0.08,
              color: this.kinematic ? T.amberHi : T.cyanHi, alpha: 0.9 });
  }
}

// A ring (annulus) gear: teeth on both the inner and outer pitch circles.
//  - inner pitch circle: internal mesh with a gear inside it (same spin direction)
//  - outer pitch circle: normal external mesh
class RingGearTile extends TileBase {
  constructor(pos, inner_r, rim, module) {
    super(pos, false);
    this.label = "RG";
    this.inner_pr = inner_r;          // inner pitch radius (drives planets)
    this.rim = rim;                   // inner pitch -> outer pitch
    this.outer_pr = inner_r + rim;    // outer pitch radius (external mesh)
    this.module = module;
  }
  is_ring() { return true; }
  pitch_r() { return this.outer_pr; }          // external meshing uses the outer circle
  inner_r() { return this.inner_pr; }
  // A ring is a big hoop, so give it a large rotational inertia.
  inertia(rp_ref) { const s = rp_ref <= 1e-9 ? 1 : this.outer_pr/rp_ref; return INERTIA_K*s*s*1.6; }
  friction_b(rp_ref) { const s = rp_ref <= 1e-9 ? 1 : Math.pow(this.outer_pr/rp_ref, FRICTION_B_SCALE_R); return DAMPING.friction*s; }
  hit_radius() { return this.outer_pr*1.02; }
  contains(p) { const d = dist(this.pos, p); return d <= this.outer_pr*1.06 && d >= this.inner_pr*0.78; }  // the rim, not the hole
  // Filled teeth standing on one of the pitch circles.
  _teeth_on(ctx, radius, inward) {
    const cp = this.module * Math.PI;
    const n = Math.max(6, Math.round(TAU * radius / cp));
    const add = this.module * 1.05, ded = this.module * 1.30;
    const r0 = radius + (inward ? add : -ded), r1 = radius + (inward ? -ded : add);
    const s = TAU / n, wt = s * 0.17, wr = s * 0.31;
    const rTip = inward ? r0 : r1, rRoot = inward ? r1 : r0;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = i * s;
      ctx.moveTo(rRoot * Math.cos(a - wr), rRoot * Math.sin(a - wr));
      ctx.lineTo(rTip * Math.cos(a - wt), rTip * Math.sin(a - wt));
      ctx.lineTo(rTip * Math.cos(a + wt), rTip * Math.sin(a + wt));
      ctx.lineTo(rRoot * Math.cos(a + wr), rRoot * Math.sin(a + wr));
      ctx.closePath();
    }
    ctx.fillStyle = shadeHex(T.alloyRing, 1.18); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 0.9; ctx.stroke();
  }
  draw() {
    const ctx = G.ctx, base = T.alloyRing;
    const ri = this.inner_pr, ro = this.outer_pr;
    const nSlot = clampf(Math.round(TAU * ((ri + ro) / 2) / (ro - ri) / 1.55), 6, 16) | 0;
    const body = ring_body_path(ri, ro, nSlot);
    ctx.save();
    ctx.translate(this.pos[0], G.fy(this.pos[1]));
    // teeth first, under the rim, so the rim edge cuts them cleanly
    ctx.save(); ctx.rotate(-this.angle);
    this._teeth_on(ctx, ro, false);
    this._teeth_on(ctx, ri, true);
    ctx.restore();
    // Body. The slots turn with the ring but the light does not, so clip in the
    // rotated frame, then rotate back before painting the fixed-direction fills.
    ctx.save();
    ctx.rotate(-this.angle);
    ctx.clip(body, "evenodd");
    ctx.rotate(this.angle);
    ctx.fillStyle = plate_fill(ctx, base, ro); ctx.fillRect(-ro, -ro, 2 * ro, 2 * ro);
    ctx.fillStyle = plate_spec(ctx, base, ro); ctx.fillRect(-ro, -ro, 2 * ro, 2 * ro);
    ctx.restore();
    // engraved edges on every opening, including the slots
    ctx.save(); ctx.rotate(-this.angle);
    ctx.strokeStyle = "rgba(0,0,0,0.55)"; ctx.lineWidth = 2; ctx.stroke(body);
    ctx.strokeStyle = ca(liftHex(base, 0.4), 0.35); ctx.lineWidth = 1; ctx.stroke(body);
    ctx.restore();
    // rim bevels
    ctx.beginPath(); ctx.arc(0, 0, ro, 0, TAU);
    ctx.strokeStyle = bevel_stroke(ctx, ro); ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, ri + 1.5, 0.6 * Math.PI, 1.6 * Math.PI);
    ctx.strokeStyle = "rgba(255,255,255,0.16)"; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
    if (this.locked) draw_lock_x(this.pos[0], this.pos[1], this.outer_pr * 0.5);
  }
}

// Menu MODEL
// The chrome is HTML/CSS now (see the #rail element and the CHROME controller):
// this class only holds the button list and the tool rail's screen rect, which
// the game still needs for "drag a gear onto the rail to scrap it".
// ============================================================
class MenuButton {
  constructor(label, id) { this.label = label; this.id = id; }
}
class GearMenu {
  constructor() { this.buttons = []; this.x = MENU_PAD; this.y = MENU_PAD; this.w = MENU_W; this.h = 0; }
  set_buttons(list) { this.buttons = list.map(([l, id]) => new MenuButton(l, id)); this.version = (this.version || 0) + 1; }
  button(id) { return this.buttons.find(b => b.id === id) || null; }
  ids() { let k = ""; for (const b of this.buttons) k += b.id + ","; return k; }
  // Fallback rect until the chrome layer publishes the real one.
  layout(W, H) { this.x = MENU_PAD; this.y = MENU_PAD; this.w = MENU_W; this.h = H - 2*MENU_PAD; }
  // Called by the chrome layer each layout pass, in y-up UI coords.
  set_rect(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; }
  contains(px, py) { return px >= this.x && px <= this.x+this.w && py >= this.y && py <= this.y+this.h; }
}

// ============================================================
// Game (port of GearMeshScene)
// ============================================================
const _roBuf = [];
const _roPlaced = [];
const _chipBoxes = [];
const _byZ = (a, b) => a.z - b.z;
const _layers = new Map();   // baked full-screen backdrop / vignette bitmaps
let _layerSize = "";
const _zBuf = [];            // reusable z-sorted draw order
class Game {
  constructor(W, H) {
    this.W = W; this.H = H;
    this.anim = 0;                      // presentation clock (dashes, sweeps)
    this.origin = [W*0.5, H*0.5];
    this.tile_list = []; this.links = [];
    this.dragging = false; this.drag_tile = null;
    this.touch_start = [0, 0]; this.paused = false; this.selected_driver = null;
    this.mesh_edges = []; this._graph = new Map(); this._topology_dirty = true;
    this.readout_mode = "ratio"; this.readout_scope = "all";
    this._flashes = []; this._meshSeen = null;
    this.zoom = 1; this.camPanX = 0; this.camPanY = 0;   // view camera
    this._recompute_geometry();
    this.mode = "menu"; this.level_idx = 0; this.win = false;
    this.menu = new GearMenu();
    this.enter_main_menu();
  }

  set_size(W, H) {
    const oldStep = this.step, oldOrigin = this.origin;
    this.W = W; this.H = H; this._reset_camera();
    this.origin = [W*0.5, H*0.5];
    this._recompute_geometry();
    this.menu.layout(W, H);
    // Rescale gear sizes and positions uniformly so meshing/tangency is preserved.
    const scale = this.step / oldStep;
    const remap = (p) => [this.origin[0] + (p[0] - oldOrigin[0]) * scale,
                          this.origin[1] + (p[1] - oldOrigin[1]) * scale];
    for (const t of this.tile_list) {
      if (t.is_rack()) {
        t.len *= scale; t.s *= scale;
        t.module = this.circular_pitch_px/Math.PI; t.thick = Math.max(6, t.module*3.0);
        t.home = remap(t.home); t.sync_pos();
        continue;
      }
      if (t.is_ring()) {
        t.inner_pr = this.Rp2*RING_INNER_MULT; t.rim = this.Rp2*RING_RIM_MULT;
        t.outer_pr = t.inner_pr + t.rim; t.module = this.circular_pitch_px/Math.PI;
        t.pos = remap(t.pos);
        continue;
      }
      if (t instanceof HexGearTile) t.set_radius(this._RH(t.label)); else t.set_pitch(this.Rp_small);
      t.pos = remap(t.pos);
    }
    for (const l of this.links) { l.r_pin *= scale; l.len *= scale; }
    this._mark_dirty();
  }

  // ---- mode switching ----
  _clear_board() {
    // mesh_edges is cleared too: the menu never runs the solver, so a stale edge
    // list from the previous board would otherwise survive into it and be read by
    // anything that asks the menu what is on the bench.
    this.tile_list = []; this.links = []; this.mesh_edges = [];
    this.dragging = false; this.drag_tile = null; this.selected_driver = null;
    this.paused = false; this.win = false; this._win_at = null; this._stars = 0; this._mark_dirty();
  }
  _main_menu_items() {
    const items = [["Free Play", "free"]];
    LEVELS.forEach((lv, i) => items.push(["Level " + (i+1) + ":  " + lv.name, "lvl_" + i]));
    return items;
  }
  _win_items() {
    const rest = [["Restart", "restart"], ["Main Menu", "menu"]];
    if (this.level_idx + 1 < LEVELS.length) return [["Next Level", "next"]].concat(rest);
    return rest;
  }
  enter_main_menu() { this.mode = "menu"; this._reset_camera(); this._clear_board(); }
  cycle_readouts() {
    const i = READOUT_MODES.indexOf(this.readout_mode);
    this.readout_mode = READOUT_MODES[(i + 1) % READOUT_MODES.length];
  }
  cycle_scope() {
    const i = READOUT_SCOPES.indexOf(this.readout_scope);
    this.readout_scope = READOUT_SCOPES[(i + 1) % READOUT_SCOPES.length];
  }
  // Sensible default, not a rule: a phone starts on the motor and the targets
  // because six pills do not fit, and the player can say otherwise.
  _default_scope() { return this.W <= CHROME_BREAKPOINT ? "key" : "all"; }
  start_free_play() {
    this.mode = "free"; this._reset_camera(); this._clear_board();
    this.readout_mode = "speed";       // the bench is where torque matters
    this.readout_scope = this._default_scope();
    this.menu.set_buttons([
      ["Add U1","add_tri"],["Add U2","add_u2"],["Add U3","add_u3"],
      ["Add U4","add_u4"],["Add U5","add_u5"],["Spring","add_sp"],
      ["Rack","add_rack"],["Link","add_link"],["Ring","add_ring"],
      ["Wind Up","wind_up"],["Damp: Normal","damp"],["Readouts","readout"],["Detail","scope"],
      ["Speed -","spd_dn"],["Speed +","spd_up"],["Pause","pause"],["Menu","to_menu"]]);
    this._sync_damp_label();
    this.menu.layout(this.W, this.H);
    this._spawn_initial();
    this.selected_driver = this.tile_list.find(t => t.is_driver) || null;
    this._mark_dirty(); this._ensure_rebuilt();
  }
  _levelPos(p) {
    // Level positions are authored in units of Rp2 (U2 pitch radius) from centre.
    return [this.origin[0] + this.Rp2 * p[0], this.origin[1] + this.Rp2 * p[1]];
  }
  _add_anchor(spec, isDrive) {
    const t = this._add_gear(spec.type || "U2", this._levelPos(spec.pos), isDrive);
    t.anchored = true; t.role = isDrive ? "drive" : "driven";
    t.spec = spec; t.lvid = spec.id || null;
    if (spec.hand) t.hand = spec.hand;
    if (spec.dial) t.dial = spec.dial;
    return t;
  }
  _anchor(id) { return this.tile_list.find(t => t.lvid === id) || null; }
  _drop_inventory(inv) {
    // The player's parts are laid out in one tidy row along the bottom of the
    // arena, in inventory order, left to right. Deterministic on purpose: a level
    // looks identical every time it is opened, the row never lands on top of the
    // machine, and the harness can assert where the parts are.
    if (!inv.length) return;
    const tiles = inv.map(type => this._add_gear(type, [0, 0], false));
    const U = this.Rp2;
    const rs = tiles.map(t => t.pitch_r() / U);
    const maxR = Math.max(...rs);
    const span = 2 * LEVEL_BOX.x;
    let gap = STAGE_GAP;
    const width = (g) => rs.reduce((a, r) => a + 2 * r, 0) + g * (rs.length - 1);
    if (width(gap) > span) gap = Math.max(0.06, (span - width(0)) / Math.max(1, rs.length - 1));
    // The row sits just under the machine rather than pinned to the bottom of the
    // box: on a sparse level that turns a screen of empty arena into a short drag,
    // and the camera frames both together so nothing is lost by moving it up.
    let low = 1e9;
    for (const t of this.tile_list) {
      if (!t.anchored) continue;
      const e = (t.dial ? this._dial_r(t) : t.pitch_r() * 1.30) / U;
      low = Math.min(low, (t.pos[1] - this.origin[1]) / U - e);
    }
    // 1.45 clears the goal tag that hangs under a target, not just the target.
    const y = low < 1e8 ? Math.max(LEVEL_BOX.bottom + maxR + 0.15, low - 1.45 - maxR)
                        : LEVEL_BOX.bottom + maxR + 0.15;
    let x = -width(gap) / 2;
    tiles.forEach((t, i) => {
      x += rs[i];
      t.pos = this._levelPos([x, y]);
      t.z = 200 + i;
      x += rs[i] + gap;
    });
  }
  start_level(idx) {
    this.mode = "puzzle"; this._reset_camera();
    this.readout_mode = "ratio";       // every goal in the campaign is a ratio
    this.readout_scope = this._default_scope();
    DAMP_MODE = 0; DAMPING = DAMP_PRESETS[0];   // puzzles always use the tuned feel
    this.level_idx = Math.max(0, Math.min(idx, LEVELS.length - 1));
    this._clear_board();
    const lv = LEVELS[this.level_idx];
    for (const d of lv.drives) {
      const t = this._add_anchor(d, true);
      if (t) t.drive_speed = rpm_to_omega(d.rpm);
    }
    for (const v of lv.driven) this._add_anchor(v, false);
    // Big wheels sit behind small ones: a compound reduction genuinely overlaps in
    // plan view (see CLOCK.md), and this is what keeps it readable. A wheel wearing
    // a dial goes in front of everything the player will pile on top of it —
    // otherwise the motion work buries the clock face it exists to drive.
    this.tile_list.forEach(t => {
      t.z = (t.dial ? 300 : 40) - t.pitch_r() / this.Rp2;
    });

    this._drop_inventory(lv.inventory || []);   // stage the player's gears

    this.menu.set_buttons([["Readouts", "readout"], ["Detail", "scope"],
                           ["Restart", "restart"], ["Menu", "to_menu"]]);
    this.menu.layout(this.W, this.H);
    this._win_at = null;
    this._mark_dirty(); this._ensure_rebuilt();
    this._frame_level();
  }
  _placed_count() { let n = 0; for (const t of this.tile_list) if (!t.anchored) n++; return n; }
  // --- scoring -------------------------------------------------------------
  // Every level ships more parts than its answer needs, and the score is about
  // economy: what did you actually put to work? A part counts when it is placed
  // AND connected to a motor — a spare left in the tray, or dropped somewhere
  // idle, is not part of the machine. `drive_ratio` is stamped by the solver, so
  // this is the solver's own answer to "is this thing in the train".
  parts_used() {
    let n = 0;
    for (const t of this.tile_list) if (!t.anchored && t.drive_ratio != null) n++;
    return n;
  }
  par() { return (LEVELS[this.level_idx].solution || []).length; }
  stars() {
    const used = this.parts_used(), par = this.par();
    return used <= par ? 3 : used === par + 1 ? 2 : 1;
  }
  // Re-scored while the level stays solved, so a player who finds a cheaper build
  // after the sheet appears keeps the better result. It never goes down: pulling
  // the machine apart afterwards cannot cost you the stars you earned.
  _rescore() {
    const driven = this.tile_list.filter(t => t.role === "driven");
    if (!driven.length || !driven.every(t => this.target_ok(t))) return;
    this._stars = Math.max(this._stars || 0, this.stars());
  }
  // Is one target's goal met? Every level's win condition goes through here, and
  // every clause reads a value the ratio solver produced — nothing is special-cased
  // and nothing is read out of the draw path.
  target_ok(t) {
    const s = t.spec || {};
    // A wound spring is stored state, not motion — it stays wound whether or not the
    // train that wound it is still attached, so this one is asked before the rest.
    if (s.wind_turns !== undefined) return Math.abs(t.wind || 0) / TAU >= s.wind_turns - 1e-9;
    // THE TARGET MUST BE DRIVEN, not merely moving. A gear spun up and then cut loose
    // coasts for about a second, which is long enough to unhook it, hook something
    // else up, and collect a win off a machine that no longer exists. `drive_ratio` is
    // null for every part of a component with no motor in it, so this is the solver's
    // own answer to "is there a live path from a motor to here" — the same answer the
    // score already uses to decide which parts count.
    if (t.drive_ratio == null) return false;
    // ...and the train must be being driven to turn, not just connected to a stopped
    // motor or held at a fully wound spring's stop.
    if (!(Math.abs(t.omega) > WIN_SPIN_EPS)) return false;
    if (!(Math.abs(t.steady_omega) > WIN_SPIN_EPS)) return false;
    if (s.spin !== undefined && Math.sign(t.omega) !== Math.sign(s.spin)) return false;
    // The one goal that reads a SPEED rather than a ratio, and so the one that has to
    // care where the train settles: a train decaying from a coast passes through any
    // band on its way down. Reading the solved steady state instead of the current
    // speed makes it exact on the first frame — no false positive in passing, and no
    // waiting for the servo to converge either.
    if (s.min_rpm !== undefined || s.max_rpm !== undefined) {
      const rpm = Math.abs(omega_to_rpm(t.steady_omega));
      if (s.min_rpm !== undefined && rpm < s.min_rpm) return false;
      if (s.max_rpm !== undefined && rpm > s.max_rpm) return false;
    }
    if (s.ratio) {
      const o = this._anchor(s.ratio.of);
      // Both ends must hang off the SAME motor, or the comparison is between two
      // unrelated machines that happen to be turning at a flattering pair of speeds.
      if (!o || o.drive_ratio == null || o.drive_id !== t.drive_id) return false;
      if (!(Math.abs(o.omega) > WIN_SPIN_EPS) || Math.abs(o.drive_ratio) < 1e-12) return false;
      // Straight out of the solve. `drive_ratio` is fixed by geometry, so this is the
      // pair's true ratio on the frame the last gear lands — identical to omega/omega
      // on a settled train, and immune to what either gear happens to be doing while
      // it gets there.
      const got = t.drive_ratio / o.drive_ratio, want = s.ratio.value;
      if (Math.abs(got - want) > Math.abs(want) * (s.ratio.tol !== undefined ? s.ratio.tol : 0.02)) return false;
    }
    return true;
  }
  // One line of plain English per target, for the objective panel and the tag the
  // target wears on the board. Written once so the two can never disagree.
  target_goal_text(t, short) {
    const s = t.spec || {};
    if (s.wind_turns !== undefined) return "WIND TO " + s.wind_turns;
    if (s.ratio) {
      const a = Math.abs(s.ratio.value);
      const ref = this._anchor(s.ratio.of);
      const of = short ? "" : " " + ((ref && (ref.dial || (ref.role === "drive" ? "DRIVE" : "TARGET"))) || "DRIVE");
      // Sign is carried by the arrow on the part, not by a word: the arrow cannot
      // be read backwards and "clockwise" can.
      return (a >= 1 ? (Math.round(a * 10) / 10) + "×" : "1 : " + Math.round(1 / a)) + of;
    }
    if (s.min_rpm !== undefined && s.max_rpm !== undefined) return s.min_rpm + "–" + s.max_rpm + " RPM";
    if (s.min_rpm !== undefined) return "OVER " + s.min_rpm + " RPM";
    if (s.max_rpm !== undefined) return "UNDER " + s.max_rpm + " RPM";
    if (s.spin !== undefined) return "TURN THIS WAY";
    return "TURNING";
  }
  _check_win() {
    const driven = this.tile_list.filter(t => t.role === "driven");
    if (driven.length && driven.every(t => this.target_ok(t))) {
      this.win = true;
      this._win_at = this.anim;
      this._stars = this.stars();
      this._frame_solved();
    }
  }

  _recompute_geometry() {
    const legacy_unit = Math.min(this.W, this.H) * 0.085 * GRID_SCALE;
    this.R2 = legacy_unit * PAD_RADIUS_MULT; this.step = this.R2;
    const a2 = this.R2 * C30;
    this.Rp2 = 0.5*(this.R2 + a2);
    this.Rp_small = 0.5*this.Rp2;
    this.R3 = this.R2 * UNIT3_RADIUS_MULT;
    this.R4 = this.R2 * HEX_MULT.U4;
    this.R5 = this.R2 * HEX_MULT.U5;
    this.safe_margin = this.R5 * 0.22;
    this.circular_pitch_px = CIRC_PITCH_PX_MULT * this.step;
    this.tap_move_tol = this.step * TAP_MOVE_TOL_MULT;
    this.mesh_tol = this.step * 0.14;    // pitch circles this close to tangent => meshing
    this.snap_reach = this.step * 0.9;   // how near a gear must drop to snap onto another
    // How near a two-gear pocket a drop must be to use it. A gear that has to mesh
    // two fixed neighbours has essentially one correct position, so being eager
    // here is the difference between a branch level feeling precise and feeling
    // fussy; the pocket is only ever considered when a real tangency to both
    // exists, so eagerness cannot invent a placement.
    // 0.52 step is where a six-planet rosette starts snapping its planets into each
    // other's pockets instead of sitting at the angle they were dropped at, so this
    // stays comfortably under it.
    this.pocket_tol = this.step * 0.40;
  }
  _RH(label) { return this.R2 * (HEX_MULT[label] || 1.0); }  // hex radius for a size label

  // ---- view camera (zoom + pan) ----
  _reset_camera() {
    this.zoom = 1; this.camPanX = 0; this.camPanY = 0;
    this._cam_to = null; this._cam_pending = null;
  }
  // Getting to watch your machine work is the reward, so a solved level frames
  // itself: the camera eases onto the mechanism, fitted into the screen area the
  // chrome and the completion sheet are NOT using.
  _frame_solved() {
    const live = new Set();
    for (const [a, b] of this.mesh_edges) { live.add(a); live.add(b); }
    const parts = this.tile_list.filter(t => t.anchored || live.has(t));
    if (!parts.length) return;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const t of parts) {
      const pill = (t.anchored ? this.step * 0.55 : 0);
      const r = pill + (t.dial ? this._dial_r(t) + this.step * 0.38
                               : t.pitch_r() * 1.30 + this.step * 0.30);
      x0 = Math.min(x0, t.pos[0] - r); x1 = Math.max(x1, t.pos[0] + r);
      y0 = Math.min(y0, t.pos[1] - r); y1 = Math.max(y1, t.pos[1] + r);
    }
    const b = this._screen_box(true);                  // room for the completion sheet
    const z = clampf(Math.min((b.x1 - b.x0) / Math.max(1, x1 - x0),
                              (b.y1 - b.y0) / Math.max(1, y1 - y0)) * 0.96, 0.5, 1.8);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const to = { zoom: z, panX: (b.x0 + b.x1) / 2 - z * cx,
                 panY: (b.y0 + b.y1) / 2 - z * (this.H - cy) };
    // Held, not applied. Moving the camera the instant a level solves pulls the
    // board out from under a hand that is still on it, which reads as the part
    // having been dropped somewhere wrong. It waits for the reveal beat, and any
    // touch before then cancels it for good.
    this._cam_pending = to;
  }
  // The whole board — machine and staging row — fitted to the screen when the level
  // opens. Without it a two-gear level is a pair of specks in a mostly empty arena
  // at 1280x800, and a wide one runs off the edge at 390px.
  _frame_level() {
    const parts = this.tile_list;
    if (!parts.length) return;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const t of parts) {
      // Readout pills float above a part; leave them a little headroom so the
      // frame does not end flush with the gear they annotate.
      const pill = (t.anchored ? this.step * 0.55 : 0);
      const r = pill + (t.dial ? this._dial_r(t) + this.step * 0.42
                               : t.pitch_r() * 1.30 + this.step * 0.34);
      x0 = Math.min(x0, t.pos[0] - r); x1 = Math.max(x1, t.pos[0] + r);
      y0 = Math.min(y0, t.pos[1] - r); y1 = Math.max(y1, t.pos[1] + r);
    }
    const b = this._screen_box(false);
    const z = clampf(Math.min((b.x1 - b.x0) / Math.max(1, x1 - x0),
                              (b.y1 - b.y0) / Math.max(1, y1 - y0)) * 0.96, 0.5, 1.6);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    this.zoom = z;
    this.camPanX = (b.x0 + b.x1) / 2 - z * cx;
    this.camPanY = (b.y0 + b.y1) / 2 - z * (this.H - cy);
    this._cam_to = null;
  }
  // The screen rectangle the chrome is NOT using, in CSS px (y-down).
  //
  // Derived from the layout breakpoint rather than from the rail's published rect:
  // that rect is a fallback until the chrome has measured itself, and the order in
  // which update and render interleave is not something the camera should depend
  // on. These four numbers mirror the stylesheet, the way DESIGN.md's tokens do.
  _screen_box(reserveSheet) {
    const dock = this.W <= CHROME_BREAKPOINT;          // mobile dock vs desktop rail
    const x0 = dock ? 16 : RAIL_W_PX + 28, x1 = this.W - 16;
    const y0 = dock ? 64 : 68;
    const chromeBottom = dock ? this.H - DOCK_H_PX - 20 : this.H - 44;
    const y1 = chromeBottom - (reserveSheet ? (dock ? 170 : 104) : 0);
    return { x0, x1, y0, y1: Math.max(y0 + 120, y1) };
  }
  // The completion UI waits a beat so the reveal is the machine, not a panel.
  // Driven by the simulation clock, not wall time, so a headless run sees the same
  // sequence a player does.
  win_revealed() { return this.win && this._win_at !== null && (this.anim - this._win_at) > WIN_REVEAL_DELAY; }
  // Convert a canvas/screen point (CSS px, y-down) to world coords (y-up).
  screen_to_world(mx, my) {
    return [(mx - this.camPanX) / this.zoom, this.H - (my - this.camPanY) / this.zoom];
  }
  // A UI point (menus/HUD are drawn unzoomed) in the y-up space the menus use.
  screen_to_ui(mx, my) { return [mx, this.H - my]; }
  zoom_at(px, py, factor) {
    const zNew = clampf(this.zoom * factor, 0.4, 4.0);
    const k = zNew / this.zoom;
    this.camPanX = px - k * (px - this.camPanX);
    this.camPanY = py - k * (py - this.camPanY);
    this.zoom = zNew;
  }
  pan_by(dx, dy) { this.camPanX += dx; this.camPanY += dy; }
  cancel_drag() {
    if (this.dragging && this.drag_tile) { this._replace_tile(this.drag_tile); this._mark_dirty(); }
    this.dragging = false; this.drag_tile = null;
  }
  _refresh_teeth_all() {
    // Tooth length is set by the module (tooth size), which is the same for every
    // meshing gear — so big gears get MORE teeth, not longer ones. addendum ~ 1
    // module above the pitch circle, dedendum ~ 1.25 below. This keeps teeth
    // interlocking cleanly at the pitch point regardless of gear size.
    const module = this.circular_pitch_px / Math.PI;
    const add = module * 1.05, ded = module * 1.30;
    for (const t of this.tile_list) {
      if (t.is_rack()) { t.module = module; continue; }   // rack teeth follow the same module
      const rp = t.pitch_r();
      t.teeth = compute_teeth_from_pitch_radius(rp, this.circular_pitch_px);
      t.tooth_outer_r = rp + add;
      t.tooth_inner_r = Math.max(rp * 0.45, rp - ded);
    }
  }
  _mark_dirty() { this._topology_dirty = true; }
  _ensure_rebuilt() {
    if (!this._topology_dirty) return;
    this._refresh_teeth_all();
    this._graph = this._build_ratio_graph();

  // Hops from the nearest motor, over meshes and shafts alike. A mesh ratio is only
  // meaningful with a direction — "one turn in, 2.5 out" — and this is what says
  // which end is "in". Recomputed on topology change, never per frame.
  _rank_from_drives() {
    for (const t of this.tile_list) t.depth = 1e9;
    const q = [];
    for (const t of this.tile_list) if (t.is_driver) { t.depth = 0; q.push(t); }
    const adj = this._graph;
    for (let i = 0; i < q.length; i++) {
      const c = q[i];
      const nb = adj.get(c);
      if (!nb) continue;
      for (const [n] of nb) if (n.depth > c.depth + 1) { n.depth = c.depth + 1; q.push(n); }
    }
  }
  // Presentation only: remember which pairs are meshed so a NEW engagement can
  // be acknowledged with a one-shot ring at the contact point. Runs on topology
  // change, not per frame.
  _track_engagements() {
    const cur = new Set();
    for (const [a, b] of this.mesh_edges) {
      const k = (a.uid < b.uid ? a.uid + "_" + b.uid : b.uid + "_" + a.uid);
      cur.add(k);
      if (this._meshSeen && !this._meshSeen.has(k)) {
        const d = dist(a.pos, b.pos) || 1;
        const f = clampf(a.pitch_r() / d, 0.1, 0.9);
        this.flash(a.pos[0] + (b.pos[0] - a.pos[0]) * f,
                   a.pos[1] + (b.pos[1] - a.pos[1]) * f, this.step * 0.85, T.cyan);
      }
    }
    this._meshSeen = cur;
  }
  flash(x, y, r, color) {

    this._flashes.push({ x, y, r, c: color, t0: this.anim });
  }
  // One-shot rings: a mesh seating, a target coming alive. Driven by the
  // presentation clock, so headless captures are reproducible.
  _draw_flashes() {
    const F = this._flashes;
    for (let i = F.length - 1; i >= 0; i--) {
      const f = F[i], age = (this.anim - f.t0) / 0.5;
      if (age >= 1 || age < 0) { F.splice(i, 1); continue; }
      const e = 1 - Math.pow(1 - age, 3);
      G.ring(f.x, f.y, f.r * (0.2 + 0.9 * e), f.c, 0.6 * (1 - age), 3 * (1 - age) + 0.5);

  // ---- placement (free positions, pitch-diameter snapping) ----
  // Free mode has no arena limits — gears can be placed anywhere (pan/zoom to reach
  // them). Puzzle inventory staging still keeps its scattered pieces on-screen.
  is_pos_safe(x, y) { return this.mode !== "puzzle" || this._in_view(x, y); }
  _in_view(x, y) { const m = this.safe_margin; return x >= m && x <= this.W - m && y >= m && y <= this.H - m; }
  // Would a gear of pitch rp at pos collide with an existing gear? Two answers,
  // because seating and spawning want different ones.
  //
  //   "seat"  — where the player (or a level) is putting a gear ON PURPOSE.
  //     A compound reduction genuinely overlaps in plan view: the pinion is
  //     smaller than its wheel, so the next wheel always lands inside the previous
  //     wheel's footprint, and when the pinion is a U1 the next wheel's centre can
  //     sit well inside it. Real trains solve this by stacking axially, which is
  //     exactly what a shared shaft is here. Refusing those placements makes every
  //     compound train unbuildable, so seating only refuses a drop that lands
  //     inside another gear's STACK-CAPTURE radius — and a drop there is a
  //     stacking gesture, which `_stack_target` handles (0.6 * pitch_r) before
  //     this is ever consulted. There is deliberately no gap between the two.
  //
  //   "spawn" — where the game is choosing a spot for the player, out of the
  //     parts tray. Nothing is intended there yet, so it keeps full pitch-circle
  //     clearance and a new part never lands on the pile.
  _overlaps(pos, rp, ignore, mode) {
    const spawn = mode === "spawn";
    for (const t of this.tile_list) {
      if (t === ignore || (ignore && t === ignore.partner)) continue;
      if (t.is_rack() || t.is_ring()) continue; // bars and rings don't block a gear
      if (t.partner) continue;   // shaft gears sit in their own plane — don't block nesting
      const d = dist(pos, t.pos);
      const min = spawn ? rp + t.pitch_r() - this.mesh_tol*1.5 : t.pitch_r() * 0.55;
      if (d < min) return true;
    }
    return false;
  }
  // Where a gear of pitch rp must sit to mesh a ring at `drop` (inner or outer
  // circle, whichever the drop is nearer). Returns [pos, err] or null.
  _ring_snap(ring, drop, rp) {
    let u = [drop[0]-ring.pos[0], drop[1]-ring.pos[1]];
    let d = Math.hypot(u[0], u[1]); if (d < 1e-6) { u = [1,0]; d = 1; } else { u = [u[0]/d, u[1]/d]; }
    const innerD = ring.inner_r() - rp, outerD = ring.pitch_r() + rp;
    const useInner = rp < ring.inner_r() && Math.abs(d - innerD) <= Math.abs(d - outerD);
    const R = useInner ? innerD : outerD;
    if (Math.abs(d - R) > this.snap_reach) return null;
    return [[ring.pos[0] + u[0]*R, ring.pos[1] + u[1]*R], Math.abs(d - R)];
  }
  // Where a gear of pitch rp must sit to ride tangent on this rack's pitch line.
  _rack_snap_pos(rack, drop, rp) {
    const l = rack.local(drop);
    if (Math.abs(l[0]) > rack.len*0.5) return null;                 // beyond the bar's ends
    const need = rack.engage_gap(rp);
    if (Math.abs(Math.abs(l[1]) - need) > this.snap_reach) return null;
    const u = rack.dir(), n = rack.nrm(), sgn = l[1] >= 0 ? 1 : -1;
    return [rack.pos[0] + u[0]*l[0] + n[0]*sgn*need, rack.pos[1] + u[1]*l[0] + n[1]*sgn*need];

  // Slide a dropped rack sideways so its face is tangent to a nearby pinion.
  _snap_rack(rack, drop) {

    const n = rack.nrm(), u = rack.dir();
    let best = null, bestErr = 1e18;
    for (const g of this.tile_list) {
      if (g === rack || g.is_rack()) continue;
      const along = (g.pos[0]-drop[0])*u[0] + (g.pos[1]-drop[1])*u[1];
      if (Math.abs(along) > rack.len*0.5) continue;
      const perp = (g.pos[0]-drop[0])*n[0] + (g.pos[1]-drop[1])*n[1];
      const err = Math.abs(Math.abs(perp) - rack.engage_gap(g.pitch_r()));
      if (err < bestErr && err <= this.snap_reach) { bestErr = err; best = { g, perp }; }
    }
    if (!best) return;
    const sgn = best.perp >= 0 ? 1 : -1;
    const shift = best.perp - sgn * rack.engage_gap(best.g.pitch_r());   // set the gap to r + face

  _circ_intersect(c1, r1, c2, r2) {
    const dx = c2[0]-c1[0], dy = c2[1]-c1[1], d = Math.hypot(dx, dy);
    if (d < 1e-6 || d > r1 + r2 || d < Math.abs(r1 - r2)) return [];
    const a = (r1*r1 - r2*r2 + d*d) / (2*d), h2 = r1*r1 - a*a;

    const h = Math.sqrt(h2), xm = c1[0] + a*dx/d, ym = c1[1] + a*dy/d;

  // Snap a gear so its pitch circle sits tangent to nearby gears (meshing), or

  _snap_gear(t, drop) {
    const rp = t.pitch_r();
    // A rack's pitch line is a snap target too (tangency to a line instead of a circle).
    let rackPos = null, rackErr = 1e18;
    for (const rk of this.tile_list) {
      if (!rk.is_rack()) continue;
      const p = this._rack_snap_pos(rk, drop, rp);
      if (!p) continue;
      const e = Math.abs(Math.abs(rk.local(drop)[1]) - rk.engage_gap(rp));
      if (e < rackErr) { rackErr = e; rackPos = p; }

    // to each — so dropping at the small top gear's radius snaps to it, not the
    // big base it shares a shaft with.
    // A ring's inner/outer pitch circle is a snap target too.
    let ringPos = null, ringErr = 1e18;
    for (const rg of this.tile_list) {
      if (!rg.is_ring()) continue;

      if (r && r[1] < ringErr) { ringErr = r[1]; ringPos = r[0]; }
    }

    // to each — so dropping at the small top gear's radius snaps to it, not the
    // big base it shares a shaft with.
    const cand = this.tile_list
      .filter(o => o !== t && o !== t.partner && !o.is_rack() && !o.is_ring())
      .map(o => ({ o, d: dist(drop, o.pos), err: Math.abs(dist(drop, o.pos) - (rp + o.pitch_r())) }))
      .filter(c => c.d <= rp + c.o.pitch_r() + this.snap_reach)
      .sort((a, b) => a.err - b.err);
    // if a ring circle is the closest tangent, snap to it
    const bestErr0 = cand.length ? cand[0].err : 1e18;
    if (ringPos && ringErr <= Math.min(bestErr0, rackErr) && this.is_pos_safe(ringPos[0], ringPos[1])) {
      t.pos = ringPos; return;
    }
    // if the rack line is the closest thing to tangent, ride it
    const bestGearErr = cand.length ? cand[0].err : 1e18;
    if (rackPos && rackErr <= bestGearErr && !this._overlaps(rackPos, rp, t) && this.is_pos_safe(rackPos[0], rackPos[1])) {
      t.pos = rackPos; return;
    }
    // A gear tangent to TWO others has only a couple of discrete solutions (for
    // equal sizes, the 60-degree pocket). That's useful when you're deliberately
    // nestling a gear between two, but it shouldn't hijack every drop — so only
    // take it when the drop really is at that pocket. Otherwise fall through to
    // single-gear tangency, which honours the drop angle exactly.
    // The pocket must include the gear the drop is NEAREST to being tangent to.
    // Without that, a drop with one obvious neighbour can be captured by a pocket
    // formed from two further-off ones that happen to admit a double tangency —
    // which silently rebuilds the train somewhere else.
    let pocket = null, pocketD = 1e18;
    for (let i = 0; i < 1 && i < cand.length; i++) {
      for (let j = i + 1; j < cand.length && j < 5; j++) {
        const a = cand[i].o, b = cand[j].o;
        if (a.partner === b) continue;
        const pts = this._circ_intersect(a.pos, rp + a.pitch_r(), b.pos, rp + b.pitch_r());
        for (const p of pts) {
          const d = dist(p, drop);
          if (d < pocketD && !this._overlaps(p, rp, t) && this.is_pos_safe(p[0], p[1])) { pocketD = d; pocket = p; }
        }

    if (pocket && pocketD <= this.pocket_tol) { t.pos = pocket; return; }
    // Tangent to the single nearest, at the EXACT angle the gear was dropped —
    // gears sit at any angle around a neighbour, not on fixed steps.
    for (const c of cand) {
      const a = c.o, R = rp + a.pitch_r();
      let dir = [drop[0]-a.pos[0], drop[1]-a.pos[1]];
      let dl = Math.hypot(dir[0], dir[1]); if (dl < 1e-6) { dir = [1, 0]; dl = 1; }
      const base = Math.atan2(dir[1], dir[0]);
      // if the drop angle is clear, keep it verbatim; otherwise creep away in fine
      // steps (~0.6 degrees) until the gear fits
      for (let s = 0; s <= 300; s++) {
        for (const sgn of (s === 0 ? [0] : [1, -1])) {
          const ang = base + sgn * s * 0.0105;
          const p = [a.pos[0] + R*Math.cos(ang), a.pos[1] + R*Math.sin(ang)];
          if (!this._overlaps(p, rp, t) && this.is_pos_safe(p[0], p[1])) { t.pos = p; return; }

    t.pos = drop.slice();
  }
  _place_free(t, pos) {

    // game choosing a spot, so it keeps the bench tidy.
    const rp = t.pitch_r();
    if (!this._overlaps(pos, rp, t, "spawn") && this.is_pos_safe(pos[0], pos[1])) { t.pos = pos.slice(); return; }
    for (let r = this.step*0.6; r < this.step*30; r += this.step*0.5)
      for (let a = 0; a < TAU; a += Math.PI/8) {
        const p = [pos[0] + r*Math.cos(a), pos[1] + r*Math.sin(a)];

      }
    t.pos = pos.slice();
  }

  // ---- spawning ----
  _add_hex(pos, R, is_driver, label) {
    const t = new HexGearTile(pos.slice(), R, is_driver, label);
    this.tile_list.push(t); return t;
  }
  _add_tri(pos, is_driver) {
    const t = new TriGearTile(pos.slice(), this.Rp_small, is_driver);
    this.tile_list.push(t); return t;
  }
  _add_gear(type, pos, is_driver) {
    return type === "U1" ? this._add_tri(pos, is_driver) : this._add_hex(pos, this._RH(type), is_driver, type);
  }
  _spawn_initial() {
    const cx = this.origin[0], cy = this.origin[1], s = this.step;
    const drv = this._add_hex([cx - s*3, cy], this.R2, true, "U2");
    const a = this._add_hex([cx - s*0.8, cy], this.R2, false, "U2");
    const b = this._add_hex([cx + s*2.6, cy], this.R3, false, "U3");
    const c = this._add_tri([cx - s*5, cy]);
    // snap them into a meshing chain
    this._snap_gear(a, a.pos); this._snap_gear(b, b.pos); this._snap_gear(c, c.pos);
    this.tile_list.forEach((t, z) => t.z = z);
  }
  _add_rack(pos, dir_ang) {
    const t = new RackTile(pos.slice(), this.step*RACK_LEN_MULT, dir_ang || 0, this.circular_pitch_px/Math.PI);
    this.tile_list.push(t); return t;
  }
  _add_ring(pos) {
    const t = new RingGearTile(pos.slice(), this.Rp2*RING_INNER_MULT, this.Rp2*RING_RIM_MULT, this.circular_pitch_px/Math.PI);
    this.tile_list.push(t); return t;
  }
  add_gear_from_menu(id) {
    const spawn = [this.origin[0] + this.step*2.2, this.origin[1]];
    const top = () => Math.max(0, ...this.tile_list.map(x => x.z)) + 1;
    if (id === "add_rack") {
      const t = this._add_rack(spawn, 0);
      this._place_free(t, spawn);
      t.home = t.pos.slice(); t.s = 0; t.sync_pos(); t.z = top();
      return;
    }
    if (id === "add_ring") {
      const t = this._add_ring(spawn);
      this._place_free(t, spawn);
      t.z = -1;   // draw behind so planets inside it stay visible
      return;
    }
    const label = { add_tri: "U1", add_u2: "U2", add_u3: "U3", add_u4: "U4", add_u5: "U5", add_sp: "SP" }[id];
    if (!label) return;
    const t = this._add_gear(label, spawn, false);
    this._place_free(t, spawn);
    t.z = top();
  }
  // ---- linkages ----
  // Join the nearest gear/rack pair with a crank + rod. The rod length is taken
  // from the current geometry so the linkage starts consistent, but is never
  // shorter than the pin's greatest reach off the slider axis — otherwise the
  // crank-slider would have no solution partway round the turn.
  _make_link() {
    this._ensure_rebuilt();
    // A rack that's already meshed with a pinion is a geared rack, not a slider —
    // don't hijack it.
    const geared = new Set();
    for (const [a, b] of this.mesh_edges) { if (a.is_rack()) geared.add(a); if (b.is_rack()) geared.add(b); }
    let best = null, bd = 1e18;
    for (const rk of this.tile_list) {
      if (!rk.is_rack() || geared.has(rk)) continue;
      for (const g of this.tile_list) {
        if (g.is_rack()) continue;
        if (this.links.some(l => l.gear === g && l.rack === rk)) continue;
        const d = dist(rk.pos, g.pos);
        if (d < bd) { bd = d; best = { g, rk }; }
      }
    }
    if (!best) return null;
    const { g, rk } = best;
    rk.home = rk.pos.slice(); rk.s = 0; rk.sync_pos();
    const r_pin = Math.max(4, g.pitch_r() * LINK_PIN_MULT);
    const P = [g.pos[0] + r_pin*Math.cos(g.angle), g.pos[1] + r_pin*Math.sin(g.angle)];
    const n = rk.nrm();
    const off = Math.abs((g.pos[0]-rk.home[0])*n[0] + (g.pos[1]-rk.home[1])*n[1]);
    const len = Math.max(dist(P, rk.pos), off + r_pin + this.step*0.15);

  }
  _sync_link_flags() {
    for (const t of this.tile_list) if (t.is_rack()) t.kinematic = this.links.some(l => l.rack === t);
  }
  _replace_tile(t) {
    if (t.is_rack()) { this._snap_rack(t, t.pos); return; }
    if (t.is_ring()) { return; }   // a ring is the anchor; it just stays where dropped
    this._snap_gear(t, t.pos);
    if (t.partner && !t.on_shaft_top) { t.partner.pos = t.pos.slice(); t.partner.z = t.z + 1; }
  }
  // ---- stacking (concentric gears on a common shaft) ----
  _stack_target(t, world) {

    let best = null, bestd = 1e18;
    for (const o of this.tile_list) {
      if (o === t || o.partner || o.on_shaft_top || o.is_rack() || o.is_ring()) continue;
      // The gesture this competes with is "mesh with that gear", which lands at
      // the tangent distance rTop + rBase. So the capture radius is a fraction of
      // THAT, not of the base alone: scaling it off the base made stacking a big
      // gear onto a small one — which is exactly what a speed-increasing stage
      // needs — a 10px target on desktop and 5px on a phone.
      const cap = STACK_CAPTURE * (t.pitch_r() + o.pitch_r());

  _stack_on(top, base) {

    top.pos = base.pos.slice();

  }
  _unstack(top) {

    if (base) base.partner = null;
    top.partner = null; top.on_shaft_top = false;
  }
  _delete_tile(t) {
    if (t.partner) this._unstack(t.on_shaft_top ? t : t.partner);
    this.links = this.links.filter(l => l.gear !== t && l.rack !== t);
    const i = this.tile_list.indexOf(t); if (i >= 0) this.tile_list.splice(i, 1);

  }
  _cycle_driver(t) {
