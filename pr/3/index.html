    // pinion at any angle.
    if (t.is_rack()) { t.dir_ang = (t.dir_ang + Math.PI/4) % TAU; t.sync_pos(); this._mark_dirty(); return; }
    if (!t.is_driver) { t.is_driver = true; this.selected_driver = t; }
    else if (t !== this.selected_driver) { this.selected_driver = t; }
    else { t.is_driver = false; this.selected_driver = this.tile_list.find(x => x.is_driver) || null; }
  }
  _adjust_selected_speed(d_rpm) {
    if (!this.selected_driver) this.selected_driver = this.tile_list.find(x => x.is_driver) || null;
    const d = this.selected_driver; if (!d) return;
    const rpm = omega_to_rpm(d.drive_speed) + d_rpm, mx = omega_to_rpm(MAX_ABS_OMEGA);
    d.drive_speed = rpm_to_omega(clampf(rpm, -mx, mx));
  }
  _reset() {
    this.tile_list = []; this.links = [];
    this.dragging = false; this.drag_tile = null; this.paused = false; this.selected_driver = null;
    this._sync_pause_label(); this._spawn_initial();
    this.selected_driver = this.tile_list.find(t => t.is_driver) || null; this._mark_dirty();
  }

  // ---- meshing graph ----
  _active_tiles() {
    // Every gear participates except the one being dragged (and, if a base with a
    // stack is dragged, its partner too, since the pair leaves the board together).
    if (!this.drag_tile) return this.tile_list;
    const skip = new Set([this.drag_tile]);
    if (this.drag_tile.partner && !this.drag_tile.on_shaft_top) skip.add(this.drag_tile.partner);
    return this.tile_list.filter(t => !skip.has(t));
  }
  // Is a gear meshed with a rack? Returns the signed perpendicular offset (which
  // fixes the direction of travel) or null. Tangency to the rack's pitch LINE is
  // the rack version of pitch-circle tangency.
  _rack_engage(rack, gear) {
    if (rack.kinematic) return null;              // linkage-driven racks aren't geared
    const l = rack.local(gear.pos);               // [along, perpendicular]
    if (Math.abs(l[0]) > rack.len*0.5) return null;   // pinion is off the end of the bar
    if (Math.abs(Math.abs(l[1]) - rack.engage_gap(gear.pitch_r())) > this.mesh_tol) return null;
    return l[1];
  }
  // How a plain gear meshes a ring, if at all. Returns "internal" (gear rides the
  // inner teeth, same spin) or "external" (gear on the outer teeth, opposite spin).
  _ring_engage(ring, gear) {
    const d = dist(ring.pos, gear.pos), r = gear.pitch_r();
    if (Math.abs(d - (ring.inner_r() - r)) <= this.mesh_tol && r < ring.inner_r()) return "internal";
    if (Math.abs(d - (ring.pitch_r() + r)) <= this.mesh_tol) return "external";
    return null;
  }
  _build_mesh_edges() {
    // Two gears mesh when their pitch circles are (near) tangent: |d - (r1+r2)| ~ 0.
    // A gear meshes a rack when its pitch circle is tangent to the rack's pitch line.
    // A ring gear meshes on its inner circle (internal) or outer circle (external).
    // Concentric shaft partners are excluded.
    const occ = this._active_tiles();
    const out = [];
    for (let i = 0; i < occ.length; i++) {
      const a = occ[i];
      for (let j = i + 1; j < occ.length; j++) {
        const b = occ[j];
        if (a.partner === b) continue;
        if (a.is_rack() && b.is_rack()) continue;
        if (a.is_ring() && b.is_ring()) continue;      // two rings don't mesh here
        if (a.is_rack() || b.is_rack()) {

          // external gear of radius outer_pr, which is what pitch_r() returns).
          const rack = a.is_rack() ? a : b, gear = a.is_rack() ? b : a;
          if (this._rack_engage(rack, gear) !== null) out.push([a, b]);
          continue;
        }
        if (a.is_ring() || b.is_ring()) {
          const ring = a.is_ring() ? a : b, gear = a.is_ring() ? b : a;
          if (this._ring_engage(ring, gear) !== null) out.push([a, b]);
          continue;
        }
        if (Math.abs(dist(a.pos, b.pos) - (a.pitch_r() + b.pitch_r())) <= this.mesh_tol) out.push([a, b]);

  _build_ratio_graph() {

    // Linkage-driven racks are kinematic: they're positioned in closed form, so
    // they must NOT also be solved as dynamic nodes.
    const nodes = this._active_tiles().filter(t => !(t.is_rack() && t.kinematic));
    for (const t of nodes) graph.set(t, []);
    for (const [a, b] of edges) {
      if (!graph.has(a) || !graph.has(b)) continue;
      if (a.is_rack() || b.is_rack()) {
        // Rack <-> pinion:  v_rack = sign(perp) * r_pinion * omega_pinion.
        // The rack node's "omega" is that linear speed, so the generic 1-DOF
        // solver reflects its mass and any load correctly.
        const rack = a.is_rack() ? a : b, gear = a.is_rack() ? b : a;
        const perp = this._rack_engage(rack, gear);
        if (perp === null) continue;
        const k = Math.sign(perp) * gear.pitch_r();     // px per radian
        if (Math.abs(k) <= 1e-9) continue;
        graph.get(gear).push([rack, k]);
        graph.get(rack).push([gear, 1/k]);

      const ra = a.pitch_r(), rb = b.pitch_r();
      if (a.is_ring() || b.is_ring()) {

        const kind = this._ring_engage(ring, gear);
        const rg = gear.pitch_r();

        // pitch radius, +). external: outer teeth act like a normal gear (-).
        const rr = kind === "internal" ? ring.inner_r() : ring.pitch_r();
        const sign = kind === "internal" ? 1 : -1;
        graph.get(ring).push([gear, sign * (rr / rg)]);
        graph.get(gear).push([ring, sign * (rg / rr)]);
        continue;
      }
      if (rb <= 1e-9 || ra <= 1e-9) continue;
      graph.get(a).push([b, -(ra/rb)]);   // external mesh: opposite direction
      graph.get(b).push([a, -(rb/ra)]);

    // Shaft links: concentric gears share angular velocity (ratio +1).
    for (const t of nodes) {

  // ---- dynamics ----

        else { ratio.set(nb, implied); dq.push(nb); }

  _collect_component_nodes(graph, start) {

  _apply_drive_dynamics(dt) {

    // targets can only be compared to each other when they hang off the same one, and
    // `steady_omega` is where this train is heading rather than where it is right now.
    for (const t of this.tile_list) { t.drive_ratio = null; t.drive_id = null; t.steady_omega = 0; }
    for (const t of nodes) t.locked = false;
    const gain = DRIVE_SERVO_GAIN; const visited = new Set();
    for (const start of nodes) {

      for (const t of comp) visited.add(t);
      // Reference must be a GEAR: a rack's ratios are px/rad, so referencing one
      // would rescale the baseline damping and change the train's behaviour.
      const ref = [...comp].find(t => !t.is_rack()) || start;
      const [ratios, ok] = this._solve_component_ratios(graph, ref);
      if (!ok || ratios.size !== comp.size) { for (const t of comp) { t.omega = 0; t.torque = 0; t.locked = true; t.drive_ratio = null; } continue; }
      const drivers = [...comp].filter(t => t.is_driver);
      const springs = [...comp].filter(t => t.is_spring());
      // With no motor and no wound spring the train freewheels: it keeps its speed
      // and spins down under damping (I*dw/dt = -B*w), rather than stopping dead.
      const freewheel = !drivers.length && !springs.length;
      let I_eff = 0, B_eff = DAMPING.viscous;
      for (const t of comp) { const k = ratios.get(t); I_eff += t.inertia(this.Rp2)*k*k; B_eff += t.friction_b(this.Rp2)*k*k; }
      if (freewheel) B_eff += DAMPING.coast;   // extra drag that sets the coast-down time
      if (I_eff <= 1e-9) { for (const t of comp) { t.omega = 0; t.torque = 0; t.drive_ratio = null; } continue; }
      let T_drive = 0, B_motor = 0;
      for (const d of drivers) { const kd = ratios.get(d); T_drive += gain*kd*d.drive_speed; B_motor += gain*kd*kd; }
      // Spring torque, reflected to the reference gear:
      //   tau_s = -SPRING_K * wind_s   (opposes the wind)
      //   reflected: tau_s * k_s
      let T_spring = 0;
      for (const s of springs) {
        const ks = ratios.get(s);
        T_spring += -SPRING_K * s.wind * ks;
        B_eff += DAMPING.spring * ks * ks;   // internal spring loss (settles the unwind)
      }
      // Where this train ENDS UP, solved rather than waited for. At steady state the
      // acceleration is zero, so T_drive + T_spring = (B_eff + B_motor) * omega, and
      // that rearranges to one division. A win condition on a speed can read this on
      // the first frame instead of watching the servo converge — and, unlike the
      // instantaneous speed, it is not something a coasting gear can be carrying.
      const B_total = B_eff + B_motor;

      for (const t of comp) { const k = ratios.get(t); num += t.omega*k; den += k*k; }
      let omega_ref = den > 1e-9 ? num/den : 0;
      const omega_before = omega_ref;

        // No forcing: I*dw/dt = -B*w. Integrate exactly so a low-inertia component
        // (e.g. a disengaged rack) decays smoothly instead of overshooting/diverging.
        omega_ref *= Math.exp(-(B_eff / I_eff) * dt);
        if (Math.abs(omega_ref) < COAST_STOP_EPS) omega_ref = 0;   // settle to rest
      } else {
        const alpha = (T_drive + T_spring - (B_eff + B_motor)*omega_ref) / I_eff;
        omega_ref = clampf(omega_ref + alpha*dt, -MAX_ABS_OMEGA, MAX_ABS_OMEGA);
      }
      // Integrate each spring's wind (dwind_s/dt = omega_s = k_s * omega_ref)
      // and hard-stop the train if any spring reaches "fully wound".
      let fullyWound = false;
      for (const s of springs) {
        const ks = ratios.get(s);
        let w = s.wind + ks * omega_ref * dt;
        if (w > SPRING_MAX_WIND) { w = SPRING_MAX_WIND; fullyWound = true; }
        else if (w < -SPRING_MAX_WIND) { w = -SPRING_MAX_WIND; fullyWound = true; }
        s.wind = w;
      }
      if (fullyWound) omega_ref = 0;   // can't wind further; spring torque unwinds it next frame
      // Integrate rack travel (ds/dt = k_rack * omega_ref).
      // Racks slide freely — no fixed end stop. A rack simply keeps moving until
      // the pinion runs off the end of the bar, at which point the mesh drops
      // (see _rack_engage) and the now-undriven rack freewheels to rest.
      for (const rk of [...comp].filter(t => t.is_rack())) {

      }
      // Physical mechanical torque at the reference DOF: tau = I*alpha + B*omega
      // (the servo's control stiffness B_motor is excluded — it isn't a real load).
      // Reflect to each gear as tau/k, so slow/large gears show more torque, fast
      // ones less — the speed/torque trade-off of a gear train.
      const alpha_actual = (omega_ref - omega_before) / dt;
      const tau_ref = I_eff * alpha_actual + B_eff * omega_ref;

      // right on the first frame while the rpm numbers are still settling — which
      // is exactly why a player cannot read ratios off the rpm numbers.
      const d0 = drivers[0], kd = d0 ? ratios.get(d0) : 0;
      const known = d0 && Math.abs(kd) > 1e-9;
      for (const t of comp) {

        t.drive_id = known ? d0.uid : null;
        t.steady_omega = fullyWound ? 0 : k * omega_ss;
        t.omega = k * omega_ref; t.locked = false;
        const raw = Math.abs(k) > 1e-9 ? tau_ref / k : 0;
        t.torque = t.torque * 0.82 + raw * 0.18;   // light smoothing so the readout is steady
      }
    }
  }

  // ---- update ----
  update(dt) {
    this.anim += dt;                    // presentation clock: never gates physics
    if (this.mode === "menu") return;
    if (this._cam_pending && this.win && !this.dragging &&
        this._win_at !== null && (this.anim - this._win_at) > WIN_REVEAL_DELAY) {
      this._cam_to = this._cam_pending; this._cam_pending = null;
    }
    if (this._cam_to) {
      const k = 1 - Math.exp(-dt * 5.5);
      this.zoom += (this._cam_to.zoom - this.zoom) * k;
      this.camPanX += (this._cam_to.panX - this.camPanX) * k;
      this.camPanY += (this._cam_to.panY - this.camPanY) * k;
    }
    this._ensure_rebuilt();
    if (this.paused) return;
    this._apply_drive_dynamics(dt);
    for (const t of this.tile_list) {
      if (t.is_rack()) continue;                       // racks translate (handled above)
      if (!t.locked && t.omega !== 0) t.angle = (t.angle + t.omega*dt) % TAU;
    }
    this._solve_linkages(dt);
    // A sliding rack changes which pinions it engages, so the topology is live.
    if (this.tile_list.some(t => t.is_rack() && Math.abs(t.omega) > 1e-6)) this._mark_dirty();
    // Never judge a board that is mid-move. A freewheeling target coasts for
    // seconds after its train is broken (COAST time constant ~1.1s), so a part
    // merely HOVERING over its final position could latch a win off the leftover
    // spin — and then drop wherever the player actually released it.
    if (this.mode === "puzzle" && !this.win && !this.dragging) this._check_win();
    else if (this.mode === "puzzle" && this.win && !this.dragging) this._rescore();
  }

  // ---- linkages (kinematic crank-slider) ----
  // A rod of fixed length L joins a pin on the gear (radius r_pin) to the slider's
  // centre, which is confined to the rack's axis. Given the gear angle, solve
  //   |P - (home + s*u)| = L   ->   s^2 - 2 s (A.u) + |A|^2 - L^2 = 0,  A = P - home
  // and take the root nearest the current s (continuity through the stroke).
  _link_pin(lk) {
    const g = lk.gear, a = g.angle + lk.phase;
    return [g.pos[0] + lk.r_pin*Math.cos(a), g.pos[1] + lk.r_pin*Math.sin(a)];
  }
  _solve_linkages(dt) {
    for (const lk of this.links) {
      const rk = lk.rack, u = rk.dir();
      if (rk === this.drag_tile || lk.gear === this.drag_tile) continue;   // don't fight the drag
      const P = this._link_pin(lk);
      const A = [P[0] - rk.home[0], P[1] - rk.home[1]];
      const au = A[0]*u[0] + A[1]*u[1];
      const disc = au*au - (A[0]*A[0] + A[1]*A[1]) + lk.len*lk.len;
      let s;
      if (disc < 0) s = au;                       // rod can't reach: ride the closest point
      else {

        s = Math.abs(s1 - rk.s) <= Math.abs(s2 - rk.s) ? s1 : s2;

      // so no artificial travel clamp is needed.
      const prev = rk.s;
      rk.s = s; rk.sync_pos();

  // ---- drawing ----
  draw_grid_points() { /* grid abandoned: gears snap by pitch tangency, not to a lattice */ }
  _draw_links() {
    const ctx = G.ctx;
    for (const lk of this.links) {
      const P = this._link_pin(lk), Q = lk.rack.pos;
      // crank circle: the path the pin sweeps
      G.dashRing(lk.gear.pos[0], lk.gear.pos[1], lk.r_pin, T.amber, 0.28, 1, 4, 5, -this.anim * 14);
      // connecting rod, with a dark underside so it reads as a solid brass link
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(P[0], G.fy(P[1]) + 1.5); ctx.lineTo(Q[0], G.fy(Q[1]) + 1.5);
      ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 6; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(P[0], G.fy(P[1])); ctx.lineTo(Q[0], G.fy(Q[1]));
      ctx.strokeStyle = shadeHex(T.alloyRod, 1.0); ctx.lineWidth = 5; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(P[0], G.fy(P[1]) - 1); ctx.lineTo(Q[0], G.fy(Q[1]) - 1);
      ctx.strokeStyle = ca(liftHex(T.alloyRod, 0.45), 0.55); ctx.lineWidth = 1.4; ctx.stroke();
      ctx.lineCap = "butt";

        ctx.fillStyle = shadeHex(T.alloyRod, 1.18); ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.55)"; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.beginPath(); ctx.arc(pt[0], G.fy(pt[1]), 1.8, 0, TAU);
        ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fill();

  }
  // Power path: where torque is actually being handed between two parts.
  draw_mesh_lines() {

    ctx.lineCap = "round";
    for (const [a, b] of this.mesh_edges) {
      const live = Math.abs(a.omega) > 1e-3 || Math.abs(b.omega) > 1e-3;
      ctx.beginPath();
      ctx.moveTo(a.pos[0], G.fy(a.pos[1])); ctx.lineTo(b.pos[0], G.fy(b.pos[1]));
      ctx.strokeStyle = ca(live ? T.cyan : T.ink3, live ? 0.30 : 0.16);
      ctx.lineWidth = live ? 3 : 2; ctx.stroke();

      const d = Math.hypot(dx, dy) || 1;
      const ra = a.is_ring() ? (a.pitch_r() + b.pitch_r() > d ? a.inner_r() : a.pitch_r()) : a.pitch_r();
      const f = clampf(ra / d, 0.12, 0.88);

      ctx.fillStyle = ca(live ? T.cyanHi : T.ink3, live ? 0.85 : 0.4); ctx.fill();

  }
  draw_pitch_circles() {
    if (!SHOW_PITCH_CIRCLES) return;

  }
  // The milled plate the whole bench sits on: light pool under the world, vignette

  // size and then blitted. Rebuilt only on resize.
  _bake(kind) {

    let c = _layers.get(kind);
    if (c) return c;

    c.width = Math.max(1, Math.round(this.W));
    c.height = Math.max(1, Math.round(this.H));

      g.addColorStop(0, ca(T.fieldHi, 0.95));

  _draw_field(ctx) { ctx.drawImage(this._bake("pool"), 0, 0, this.W, this.H); }
  _draw_vignette(ctx) { ctx.drawImage(this._bake("vig"), 0, 0, this.W, this.H); }
  // Drafting lattice, drawn in world space so it pans and zooms with the bench.
  _draw_lattice(ctx) {
    const z = this.zoom;
    const x0 = -this.camPanX / z, x1 = (this.W - this.camPanX) / z;
    const y0 = -this.camPanY / z, y1 = (this.H - this.camPanY) / z;
    const minor = this.step * 0.5, major = this.step * 2;
    const ox = this.origin[0], oy = G.fy(this.origin[1]);
    ctx.lineWidth = 1 / z;
    for (let pass = 0; pass < 2; pass++) {
      const g = pass ? major : minor;
      if (g * z < 6) continue;                       // stop drawing the fine grid when zoomed out
      ctx.beginPath();
      for (let x = ox + Math.ceil((x0 - ox) / g) * g; x <= x1; x += g) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
      for (let y = oy + Math.ceil((y0 - oy) / g) * g; y <= y1; y += g) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
      ctx.strokeStyle = pass ? "rgba(120,160,210,0.075)" : "rgba(120,160,210,0.032)";
      ctx.stroke();
    }
    // bench origin: a machinist's datum cross
    ctx.beginPath();
    ctx.moveTo(ox - 9 / z, oy); ctx.lineTo(ox + 9 / z, oy);
    ctx.moveTo(ox, oy - 9 / z); ctx.lineTo(ox, oy + 9 / z);
    ctx.strokeStyle = ca(T.cyan, 0.20); ctx.lineWidth = 1 / z; ctx.stroke();
  }
  draw() {
    const ctx = G.ctx;
    this._draw_field(ctx);
    if (this.mode === "menu") {
      ctx.save();
      ctx.translate(this.camPanX, this.camPanY); ctx.scale(this.zoom, this.zoom);
      this._draw_lattice(ctx);
      ctx.restore();
      this._draw_vignette(ctx);
      CHROME.sync(this);
      return;
    }

    // ---- world (under the view camera) ----
    ctx.save();
    ctx.translate(this.camPanX, this.camPanY);
    ctx.scale(this.zoom, this.zoom);

    this._draw_lattice(ctx);

    if (this.mode === "puzzle") {
      // the arena: a milled recess in the plate
      const m = this.safe_margin;
      G.roundRect(m, m, this.W - 2 * m, this.H - 2 * m, 12);
      ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 3 / this.zoom; ctx.stroke();
      ctx.strokeStyle = ca(T.edgeHi, 0.30); ctx.lineWidth = 1 / this.zoom; ctx.stroke();
    }

    this.draw_pitch_circles();
    this.draw_mesh_lines();
    _zBuf.length = 0;
    for (const t of this.tile_list) _zBuf.push(t);
    _zBuf.sort(_byZ);
    // A dial belongs to its wheel, so it is drawn immediately under that wheel
    // rather than behind the whole board — otherwise the going train's big wheels,
    // which a compound reduction necessarily overlaps it with, sit on the face.
    // Role rings are painted UNDER the parts: they are context, and a bright ring
    // drawn over the teeth competes with the thing it is pointing at.
    if (this.mode === "puzzle") this._draw_roles(true);
    for (const t of _zBuf) { if (t.dial) this._draw_dial(t); t.draw(); }
    if (this.mode === "puzzle") {
      this._draw_hands();
      for (const t of _zBuf) if (t.dial) this._draw_dial_label(t);
      this._draw_roles(false);
    }
    this._draw_links();
    this._draw_flashes();
    this._draw_selected_highlight();
    this._draw_readouts();
    // Chips go over the pills, not under. They answer a question the player is asking
    // this instant — "what does this mesh give me" — where a pill is ambient, and a
    // chip half-hidden behind a pill is worse than no chip.
    this._draw_mesh_ratios();

    ctx.restore();

    this._draw_vignette(ctx);
    CHROME.sync(this);
  }
  // A small engraved caption tag, world coords, centred on (cx, cy).
  _draw_tag(cx, cy, text, color) {
    const ctx = G.ctx, size = 9;
    const font = G.font(size, 600, false);
    const w = G.measure(text, font) + size * T.trackLabel * text.length + 14;
    const h = 16, y = G.fy(cy) - h / 2;
    G.roundRect(cx - w / 2, y, w, h, 3);
    ctx.fillStyle = "rgba(6,8,11,0.82)"; ctx.fill();
    ctx.strokeStyle = ca(color, 0.42); ctx.lineWidth = 1; ctx.stroke();

    for (const it of placed) {
      it.cy = clampf(it.cy, yBot + it.bh / 2, yTop - it.bh / 2);
      // keep a label tethered to its own gear
      const dx = it.cx - it.t.pos[0], dy = it.cy - it.t.pos[1];
      const d = Math.hypot(dx, dy), lim = it.r0 + this.step * 3.4;
      if (d > lim) { it.cx = it.t.pos[0] + dx / d * lim; it.cy = it.t.pos[1] + dy / d * lim; }
    }
    const ctx = G.ctx;
    const bh0 = 7 * rs;
    for (const it of placed) {
      const sel = it.t === this.selected_driver;
      const accent = sel ? T.amber : (it.t.is_driver ? T.amber : T.cyan);
      // stem: gear -> pill, aimed at wherever the pill finally settled
      let sx = it.cx - it.t.pos[0], sy = it.cy - it.t.pos[1];
      const sl = Math.hypot(sx, sy) || 1; sx /= sl; sy /= sl;
      it.ax = it.t.pos[0] + sx * (it.t.readout_top() + 2);
      it.ay = it.t.pos[1] + sy * (it.t.readout_top() + 2);
      ctx.beginPath();
      ctx.moveTo(it.ax, G.fy(it.ay));
      ctx.lineTo(it.cx - sx * it.bh * 0.5, G.fy(it.cy - sy * it.bh * 0.5));
      ctx.strokeStyle = ca(T.cyan, 0.26); ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath(); ctx.arc(it.ax, G.fy(it.ay), 2, 0, TAU);
      ctx.fillStyle = ca(T.cyan, 0.5); ctx.fill();
      // pill: machined panel, cast shadow, accent stripe on the reading edge
      const x = it.cx - it.bw / 2, y = G.fy(it.cy) - it.bh / 2;
      const pr = 6 * rs;
      G.roundRect(x + 1, y + 3, it.bw, it.bh, pr);
      ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fill();
      G.roundRect(x, y, it.bw, it.bh, pr);
      ctx.save(); ctx.translate(0, y);
      ctx.fillStyle = _gradC("PILL" + it.bh.toFixed(1), () => {
        const g = ctx.createLinearGradient(0, 0, 0, it.bh);
        g.addColorStop(0, "rgba(30,38,53,0.97)");
        g.addColorStop(1, "rgba(11,15,22,0.97)");
        return g;
      });
      ctx.fill(); ctx.restore();
      ctx.strokeStyle = sel ? ca(T.amber, 0.6) : T.edge; ctx.lineWidth = 1; ctx.stroke();
      ctx.save();
      G.roundRect(x, y, it.bw, it.bh, pr); ctx.clip();
      ctx.fillStyle = ca(accent, sel ? 0.95 : 0.55);
      ctx.fillRect(x, y, 2.5, it.bh);
      ctx.fillStyle = "rgba(255,255,255,0.07)";
      ctx.fillRect(x, y, it.bw, 1);
      ctx.restore();
      G.label(it.lines[0], it.cx + 1, it.cy + bh0, { size: fs, weight: 600, mono: true,
        align: "center", color: T.ink });
      G.label(it.lines[1], it.cx + 1, it.cy - bh0, { size: fs - 1, weight: 500, mono: true,
        align: "center", color: T.cyanHi, alpha: 0.88 });
    }
  }
  _sync_pause_label() { const b = this.menu.button("pause"); if (b) b.label = this.paused ? "Run" : "Pause"; }
  _sync_damp_label() { const b = this.menu.button("damp"); if (b) b.label = "Damp: " + DAMPING.short; }

  // ---- input ----
  _pick_tile(p) {
    const sorted = [...this.tile_list].sort((a, b) => b.z - a.z);
    for (const t of sorted) if (t.contains(p)) return t;
    return null;
  }
  _handle_menu(mid) {
    if (["add_tri","add_u2","add_u3","add_u4","add_u5","add_sp","add_rack","add_ring"].includes(mid)) { this.add_gear_from_menu(mid); this._mark_dirty(); }
    else if (mid === "add_link") { this._make_link(); }
    else if (mid === "spd_up") this._adjust_selected_speed(SPEED_STEP_RPM);
    else if (mid === "spd_dn") this._adjust_selected_speed(-SPEED_STEP_RPM);
    else if (mid === "pause") { this.paused = !this.paused; this._sync_pause_label(); }
    else if (mid === "readout") this.cycle_readouts();
    else if (mid === "scope") this.cycle_scope();
    else if (mid === "damp") {
      DAMP_MODE = (DAMP_MODE + 1) % DAMP_PRESETS.length;
      DAMPING = DAMP_PRESETS[DAMP_MODE];
      this._sync_damp_label();
    }
    else if (mid === "wind_up") {
      // Pre-load every spring to +3 turns (well inside the hard stop and below
      // the velocity clamp) so a low-damping swing starts immediately.
      for (const t of this.tile_list) if (t.is_spring()) t.wind = 3 * TAU;
    }
    else if (mid === "reset") this._reset();
    else if (mid === "restart") this.start_level(this.level_idx);
    else if (mid === "to_menu") this.enter_main_menu();
  }
  _handle_screen_button(bid) {
    if (bid === "restart") this.start_level(this.level_idx);
    else if (bid === "free") this.start_free_play();
    else if (bid === "menu") this.enter_main_menu();
    else if (bid === "next") this.start_level(this.level_idx + 1);
    else if (bid.indexOf("lvl_") === 0) this.start_level(parseInt(bid.split("_")[1], 10));
  }
  pointer_down(mx, my) {
    const ui = this.screen_to_ui(mx, my);       // chrome-layer coords (unzoomed)
    this._dragUI0 = ui[0]; this._dragUI1 = ui[1];
    const world = this.screen_to_world(mx, my); // gears (camera)
    this.touch_start = world;
    if (this.mode === "menu") return;              // the chrome layer owns that screen
    // The board stays live after a win: the completion sheet is docked out of the
    // way precisely so the player can keep moving parts, try a cheaper build, or
    // just push the machine around and watch it.
    if (this.win) { this._cam_to = null; this._cam_pending = null; }   // touch cancels the re-frame
    const chosen = this._pick_tile(world);
    if (!chosen || chosen.anchored) return;
    // Grabbing a stacked top gear pulls it off the shaft.
    if (chosen.on_shaft_top) this._unstack(chosen);
    this.dragging = true; this.drag_tile = chosen; chosen.omega = 0;
    chosen.drag_offset = [chosen.pos[0] - world[0], chosen.pos[1] - world[1]];
    chosen.z = Math.max(...this.tile_list.map(t => t.z)) + 1;
    this._mark_dirty();
  }
  pointer_move(mx, my) {
    this._dragUI0 = mx; this._dragUI1 = this.H - my;
    // Remembered for the mesh chips: hovering a part shows what it is meshed with.
    if (!this.dragging) this._hover_tile = this._pick_tile(this.screen_to_world(mx, my));
    if (!this.dragging || !this.drag_tile) return;
    const world = this.screen_to_world(mx, my);
    const t = this.drag_tile;
    t.pos = [world[0] + t.drag_offset[0], world[1] + t.drag_offset[1]]; t.omega = 0;
    if (t.partner && !t.on_shaft_top) t.partner.pos = t.pos.slice();   // base carries its stack
  }
  pointer_up(mx, my) {
    this._hover_tile = null;
    if (!this.dragging || !this.drag_tile) return;
    const t = this.drag_tile; this.drag_tile = null; this.dragging = false;
    const ui = this.screen_to_ui(mx, my);
    const world = this.screen_to_world(mx, my);
    if (this.menu.contains(ui[0], ui[1])) {
      if (this.mode === "free") { this._delete_tile(t); this._mark_dirty(); return; }
      // In puzzles the gears are limited, so don't lose them — snap back instead.
    }
    if (dist(world, this.touch_start) < this.tap_move_tol && this.mode === "free") { this._cycle_driver(t); this._replace_tile(t); this._mark_dirty(); return; }
    // Dropped onto another gear's centre (and t carries no stack of its own)? Stack it.
    const base = t.partner ? null : this._stack_target(t, world);
    if (base) { this._stack_on(t, base); this._mark_dirty(); return; }
    this._replace_tile(t); this._mark_dirty();
  }
}

// ============================================================
// ICON CRAFT
// Gear glyphs are generated from the same tooth geometry the simulation uses,
// so the tray icons are literally scale models of the parts they add.
// ============================================================
const ICO = (() => {
  const P = (c, r, a) => (c + r * Math.cos(a)).toFixed(2) + " " + (c + r * Math.sin(a)).toFixed(2);
  function gear(n, ro, ri, rh) {
    const c = 12, s = TAU / n, wt = s * 0.16, wr = s * 0.30;
    let d = "";
    for (let i = 0; i < n; i++) {
      const a = i * s;
      d += (i ? "L" : "M") + P(c, ri, a - wr) + "L" + P(c, ro, a - wt) +
           "L" + P(c, ro, a + wt) + "L" + P(c, ri, a + wr);
    }
    d += "Z";
    d += "M" + (c + rh) + " " + c + "a" + rh + " " + rh + " 0 1 0 " + (-2 * rh) + " 0" +
         "a" + rh + " " + rh + " 0 1 0 " + (2 * rh) + " 0Z";
    return '<path d="' + d + '" fill="currentColor" fill-rule="evenodd"/>';
  }
  function tri(n, ro, ri) {
    // U1: the same tooth ring, but the plate behind it is a triangle
    const c = 12;
    let d = "";
    for (let k = 0; k < 3; k++) {
      const a = k * TAU / 3 - Math.PI / 2;
      d += (k ? "L" : "M") + P(c, ro + 1.5, a);
    }
    return '<path d="' + d + 'Z" fill="currentColor" opacity=".35"/>' + gear(n, ro, ri, 2);
  }
  function spiral(turns, r0, r1) {
    const c = 12; let d = "";
    for (let k = 0; k <= 60; k++) {
      const f = k / 60, a = f * turns * TAU, r = r0 + (r1 - r0) * f;
      d += (k ? "L" : "M") + P(c, r, a);
    }
    return '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
  }
  const stroke = (d, w) => '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="' +
    (w || 1.7) + '" stroke-linecap="round" stroke-linejoin="round"/>';
  return {
    u1: tri(8, 6.6, 4.4),
    u2: gear(10, 8.2, 5.8, 2.1),
    u3: gear(13, 9.6, 7.0, 2.4),
    u4: gear(16, 10.6, 8.0, 2.6),
    u5: gear(19, 11.2, 8.6, 2.8),
    sp: gear(12, 11, 8.6, 0.1).replace("</path>", "</path>") + spiral(2.4, 1.6, 7),
    scope: stroke("M3 12h4l2.5-6 5 12 2.5-6h4"),
    star: '<path d="M12 3.2 14.7 9l6.3.8-4.6 4.3 1.2 6.2L12 17.4 6.4 20.3l1.2-6.2L3 9.8 9.3 9Z"' +
          ' fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    gauge: stroke("M4 17a8 8 0 0 1 16 0") + stroke("M12 17 16.5 11.5") +
          '<circle cx="12" cy="17" r="1.6" fill="currentColor"/>',
    rack: '<path d="M2.5 13h19v5.5h-19z" fill="currentColor"/>' +
          stroke("M5 13V9.5M9 13V9.5M13 13V9.5M17 13V9.5M21 13V9.5", 1.6),
    ring: gear(18, 11.2, 9.2, 0.1) +
          '<path d="' + (() => { let d = ""; const c = 12, s = TAU / 12;
            for (let i = 0; i < 12; i++) { const a = i * s; d += "M" + P(c, 6.2, a) + "L" + P(c, 4.4, a); }
            return d; })() + '" stroke="currentColor" stroke-width="1.3" fill="none"/>' +
          '<circle cx="12" cy="12" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>',
    link: '<circle cx="6.5" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/>' +
          stroke("M9.4 11.7 17 17") + '<path d="M14.5 15h7v4.5h-7z" fill="currentColor"/>' +
          '<circle cx="6.5" cy="9" r="1.3" fill="currentColor"/>',
    minus: stroke("M6 12h12", 2),
    plus: stroke("M12 6v12M6 12h12", 2),
    wind: stroke("M20 12a8 8 0 1 1-2.6-5.9") + stroke("M20 4.5V10h-5.4"),
    damp: stroke("M2 12c2 0 2-6 4-6s2 12 4 12 2-9 4-9 2 6 4 6 2-3 4-3", 1.6),
    pause: '<path d="M8 6h3.2v12H8zM12.8 6H16v12h-3.2z" fill="currentColor"/>',
    play: '<path d="M8.5 5.8 18 12l-9.5 6.2z" fill="currentColor"/>',
    back: stroke("M14.5 6 8.5 12l6 6", 2),
    go: stroke("M9 5.5 15.5 12 9 18.5", 2),
    restart: stroke("M4.2 12a7.8 7.8 0 1 0 2.5-5.7") + stroke("M4 4v5h5"),
    scrap: stroke("M4.5 7.5h15M9.5 7.5V5h5v2.5M6.5 7.5l1 12h9l1-12", 1.6),
    seal: '<circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".45"/>' +
          '<path d="M15 24.5 21.5 31 34 18" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>',
    brand: (() => {
      const c = 24, s = TAU / 12, wt = s * 0.16, wr = s * 0.30, ro = 21, ri = 15.5;
      let d = "";
      for (let i = 0; i < 12; i++) {
        const a = i * s;
        d += (i ? "L" : "M") + P(c, ri, a - wr) + "L" + P(c, ro, a - wt) +
             "L" + P(c, ro, a + wt) + "L" + P(c, ri, a + wr);
      }
      d += "ZM31 24a7 7 0 1 0-14 0a7 7 0 1 0 14 0Z";
      return '<path d="' + d + '" fill="currentColor" fill-rule="evenodd"/>' +
             '<circle cx="24" cy="24" r="3.1" fill="currentColor"/>';
    })(),
  };
})();

// ============================================================
// CHROME — the HTML/CSS layer stacked over the canvas.
// It owns the title screen, top bar, tool rail, hint bar and win overlay.
// The canvas keeps the simulation; see DESIGN.md for why this split.
// ============================================================
const PART_META = {
  add_tri:  { cap: "U1",     ico: "u1"   },
  add_u2:   { cap: "U2",     ico: "u2"   },
  add_u3:   { cap: "U3",     ico: "u3"   },
  add_u4:   { cap: "U4",     ico: "u4"   },
  add_u5:   { cap: "U5",     ico: "u5"   },
  add_sp:   { cap: "Spring", ico: "sp"   },
  add_rack: { cap: "Rack",   ico: "rack" },
  add_ring: { cap: "Ring",   ico: "ring" },
  add_link: { cap: "Link",   ico: "link" },
};

const CHROME = {
  el: {}, _mode: null, _railKey: null, _win: false, _txt: new Map(), _needRect: true,

  init(game) {
    const $ = (id) => document.getElementById(id);
    this.el = {
      body: document.body, topbar: $("topbar"), rail: $("rail"), hint: $("hintbar"),
      title: $("title"), titleList: $("title-list"),
      win: $("winscreen"), winSub: $("win-sub"), winActs: $("win-acts"), winStats: $("win-stats"),
      canvas: $("c"),
    };
    $("brandgear").innerHTML = ICO.brand;
    $("winseal").innerHTML = ICO.seal;
    this.buildTitle(game);
    this.buildWin(game);
    // The fade at the dock's right edge says "there is more this way". Once there
    // isn't, it is just a smear over the last button, so it fades out at the end of
    // the scroll — and stays out when the dock fits without scrolling at all.
    const fade = $("railfade");
    const syncFade = () => {
      const r = this.el.rail;
      const more = r.scrollWidth - r.clientWidth - r.scrollLeft > 4;
      fade.style.opacity = more ? "1" : "0";
    };
    this._syncFade = syncFade;
    this.el.rail.addEventListener("scroll", syncFade, { passive: true });
    addEventListener("resize", () => { this._needRect = true; syncFade(); });
  },

  // Only touch the DOM when the string actually changed — a running sim must not
  // dirty layout every frame.
  set(el, s) {
    if (!el) return;
    if (this._txt.get(el) === s) return;
    this._txt.set(el, s);
    el.textContent = s;
  },
  svg(name, cls) {
    return '<svg class="' + (cls || "ico") + '" viewBox="0 0 24 24" aria-hidden="true">' + ICO[name] + "</svg>";
  },
  btn(id, label, icon, cls, onClick, iconRight) {
    const b = document.createElement("button");
    b.className = "btn " + (cls || "");
    b.type = "button";
    b.dataset.id = id;
    const g = icon ? this.svg(icon) : "";
    b.innerHTML = (iconRight ? "" : g) + '<span class="lbl">' + label + "</span>" + (iconRight ? g : "");
    b.addEventListener("click", onClick);
    return b;
  },

  // ---------------- title screen ----------------
  buildTitle(game) {
    const list = this.el.titleList;
    list.innerHTML = "";
    const free = document.createElement("button");
    free.className = "btn level-row wide";
    free.type = "button";
    free.innerHTML = this.svg("u3", "ico") +
      '<span class="txt"><b>Free Play</b><small>Open bench — every part, no objective</small></span>' +
      this.svg("go", "go");
    free.querySelector(".ico").style.width = "26px";
    free.querySelector(".ico").style.height = "26px";
    free.addEventListener("click", () => this.act(game, "free"));
    list.appendChild(free);
    LEVELS.forEach((lv, i) => {
      const b = document.createElement("button");
      b.className = "btn level-row";
      b.type = "button";
      b.innerHTML = '<span class="idx">' + (i + 1) + "</span>" +
        '<span class="txt"><b>' + lv.name + "</b><small>" + lv.hint + "</small></span>" +
        this.svg("go", "go");
      b.addEventListener("click", () => this.act(game, "lvl_" + i));
      list.appendChild(b);
    });
  },
  act(game, id) { game._handle_screen_button(id); this._needRect = true; },

  // ---------------- win overlay ----------------
  buildWin(game) {
    const acts = this.el.winActs;
    acts.innerHTML = "";
    this._winKey = null;
  },
  syncWin(game) {
    // Gated on win_revealed(), not on win: the mechanism gets a beat to itself
    // before any UI arrives over it.
    const on = game.mode === "puzzle" && game.win_revealed();
    this.el.win.classList.toggle("on", on);
    const ws = on ? "1" : "0";
    if (this.el.body.dataset.win !== ws) this.el.body.dataset.win = ws;
    if (!on) { this._winKey = null; return; }
    const key = game.level_idx + "|" + game._win_items().map((i) => i[1]).join(",");
    if (this._winKey === key) return;
    this._winKey = key;
    const lv = LEVELS[game.level_idx];
    this.set(this.el.winSub, "Level " + (game.level_idx + 1) + " — " + lv.name);
    // what the player actually built — a small, honest result readout
    const stars = game._stars || 1, par = game.par(), used = game.parts_used();
    this.el.winStats.innerHTML =
      '<div class="stars" aria-label="' + stars + ' of 3 stars">' +
      [1, 2, 3].map((n) => this.svg("star", "st" + (n <= stars ? " on" : ""))).join("") +
      "</div>" +
      '<div class="meter"><span class="k">Parts used</span><span class="v">' +
      used + " / " + par + "</span></div>";
    const acts = this.el.winActs;
    acts.innerHTML = "";
    for (const [label, id] of game._win_items()) {
      const next = id === "next";
      acts.appendChild(this.btn(id, label, next ? "go" : "back",
        next ? "primary" : "", () => this.act(game, id), next));
    }
  },

  // ---------------- top bar ----------------
  meter(k, cls) {
    const d = document.createElement("div");
    d.className = "meter";
    d.innerHTML = '<span class="k">' + k + '</span><span class="v ' + (cls || "") + '"></span>';
    return d;
  },
  buildTop(game) {
    const bar = this.el.topbar;
    bar.innerHTML = "";
    this.el.m = {};
    // `lo` marks a meter that a 390px screen drops — the instrument keeps its
    // three most important readings and sheds the rest.
    const add = (key, label, cls, lo) => {
      const m = this.meter(label, cls);
      if (lo) m.classList.add("lo");
      bar.appendChild(m); this.el.m[key] = m.querySelector(".v");
    };
    const sep = (lo) => { const d = document.createElement("div"); d.className = "sep" + (lo ? " lo" : ""); bar.appendChild(d); };
    if (game.mode === "puzzle") {
      const t = document.createElement("div");
      t.className = "title";
      t.innerHTML = '<span class="chip amber" id="lvchip"></span><span class="name" id="lvname"></span>';
      bar.appendChild(t);
      this.el.lvchip = t.querySelector("#lvchip");
      this.el.lvname = t.querySelector("#lvname");
      const grow = document.createElement("div"); grow.className = "grow"; bar.appendChild(grow);
      add("targets", "Targets", "cyan");
      this.el.m.targets.parentElement.classList.add("mo");
      sep(true);
      add("mesh", "Mesh", "", true);
      sep(true);
      add("zoom", "Zoom", "dim", true);
      return;
    }
    const st = document.createElement("div");
    st.className = "meter";
    st.innerHTML = '<span class="k">Status</span>' +
      '<span class="v" style="display:flex;align-items:center;gap:6px"><i class="lamp"></i><span></span></span>';
    bar.appendChild(st);
    this.el.lamp = st.querySelector(".lamp");
    this.el.m = { status: st.querySelector(".v > span") };
    sep(); add("motor", "Motor", "amber");
    sep(); add("parts", "Parts");
    sep(true); add("drivers", "Motors", "", true);
    sep(true); add("mesh", "Mesh", "cyan", true);
    sep(true); add("damp", "Damping", "dim", true);
    const grow = document.createElement("div"); grow.className = "grow"; bar.appendChild(grow);
    add("zoom", "Zoom", "dim", true);
  },

  // ---------------- tool rail ----------------
  group(head) {
    const g = document.createElement("div");
    g.className = "group";
    if (head) {
      const h = document.createElement("div");
      h.className = "eyebrow";
      h.innerHTML = "<span>" + head + "</span>";
      g.appendChild(h);
    }
    return g;
  },
  buildRail(game) {
    const rail = this.el.rail;
    rail.innerHTML = "";
    const has = (id) => !!game.menu.button(id);
    this.el.r = {};

    if (game.mode === "free") {
      const parts = this.group("Parts");
      const tray = document.createElement("div");
      tray.className = "tray";
      for (const id of Object.keys(PART_META)) {
        if (!has(id)) continue;
        const m = PART_META[id];
        const b = document.createElement("button");
        b.className = "tile";
        b.type = "button";
        b.title = "Add " + m.cap;
        b.setAttribute("aria-label", "Add " + m.cap);
        b.innerHTML = this.svg(m.ico) + "<span>" + m.cap + "</span>";
        b.addEventListener("click", () => game._handle_menu(id));
        tray.appendChild(b);
      }
      parts.appendChild(tray);
      rail.appendChild(parts);

      const motor = this.group("Motor");
      const step = document.createElement("div");
      step.className = "stepper";
      const mk = (id, ico, lab) => {
        const b = document.createElement("button");
        b.type = "button"; b.innerHTML = this.svg(ico); b.setAttribute("aria-label", lab);
        b.addEventListener("click", () => game._handle_menu(id));
        return b;
      };
      step.appendChild(mk("spd_dn", "minus", "Slower"));
      const read = document.createElement("div");
      read.className = "read";
      read.innerHTML = "<b></b><i>RPM</i>";
      step.appendChild(read);
      step.appendChild(mk("spd_up", "plus", "Faster"));
      motor.appendChild(step);
      this.el.r.rpm = read.querySelector("b");
      if (has("wind_up")) motor.appendChild(this.btn("wind_up", "Wind Up", "wind", "", () => game._handle_menu("wind_up")));
      rail.appendChild(motor);

      const bench = this.group("Bench");
      if (has("damp")) {
        const b = this.btn("damp", "Damping", "damp", "", () => game._handle_menu("damp"));
        b.innerHTML = this.svg("damp") + '<span class="lbl">Damping</span><span class="val"></span>';
        this.el.r.damp = b.querySelector(".val");
        bench.appendChild(b);
      }
      if (has("readout")) {
        const b = this.btn("readout", "Readouts", "gauge", "", () => game._handle_menu("readout"));
        b.innerHTML = this.svg("gauge") + '<span class="lbl">Readouts</span><span class="val"></span>';
        this.el.r.readout = b.querySelector(".val");
        bench.appendChild(b);
      }
      if (has("scope")) {
        const b = this.btn("scope", "Detail", "scope", "", () => game._handle_menu("scope"));
        b.innerHTML = this.svg("scope") + '<span class="lbl">Detail</span><span class="val"></span>';
        this.el.r.scope = b.querySelector(".val");
        bench.appendChild(b);
      }
      if (has("pause")) {
        const b = this.btn("pause", "Pause", "pause", "", () => game._handle_menu("pause"));
        this.el.r.pause = b;
        bench.appendChild(b);
      }
      rail.appendChild(bench);
    } else {
      const lvg = this.group("Objective");
      const lv = LEVELS[game.level_idx];
      const brief = document.createElement("div");
      brief.id = "brief";
      brief.innerHTML =
        '<span class="chip amber">Level ' + (game.level_idx + 1) + "</span>" +
        '<span class="name">' + lv.name + "</span>" +
        '<span class="hint">' + lv.hint + "</span>" +
        '<span class="row"><span class="k eyebrow" style="flex:0 0 auto">Targets</span>' +
        '<span class="v"></span></span>' +
        '<span class="goals"></span>';
      // One row per target, spelling out that target's actual goal. A level with
      // three different requirements should never make the player guess which is
      // which — the same string is engraved on the part itself.
      const goals = brief.querySelector(".goals");
      const targets = game.tile_list.filter((t) => t.role === "driven");
      this.el.r = { targets: brief.querySelector(".row .v"), goals: [] };
      targets.forEach((t, i) => {
        const g = document.createElement("span");
        g.className = "goal";
        g.innerHTML = '<i class="dot"></i><span class="gt">' +
          (targets.length > 1 ? (t.dial || t.lvid || "Target " + (i + 1)) + " · " : "") +
          game.target_goal_text(t) + "</span>";
        goals.appendChild(g);
        this.el.r.goals.push({ el: g, tile: t });
      });
      lvg.appendChild(brief);
      if (has("readout")) {
        const b = this.btn("readout", "Readouts", "gauge", "", () => game._handle_menu("readout"));
        b.innerHTML = this.svg("gauge") + '<span class="lbl">Readouts</span><span class="val"></span>';
        this.el.r.readout = b.querySelector(".val");
        lvg.appendChild(b);
      }
      if (has("scope")) {
        const b = this.btn("scope", "Detail", "scope", "", () => game._handle_menu("scope"));
        b.innerHTML = this.svg("scope") + '<span class="lbl">Detail</span><span class="val"></span>';
        this.el.r.scope = b.querySelector(".val");
        lvg.appendChild(b);
      }
      if (has("restart")) lvg.appendChild(this.btn("restart", "Restart", "restart", "", () => game._handle_menu("restart")));
      rail.appendChild(lvg);
    }

    // The scrap tray fills the rail's remaining height AND is the drop target
    // that "drag a gear onto the rail to delete it" has always used.
    const tray = document.createElement("div");
    tray.id = "tray";
    if (game.mode === "free") {
      tray.innerHTML = this.svg("scrap") +
        '<span class="t">Scrap</span><span class="s">Drag a part here to scrap it</span>';
    } else {
      tray.className = "count";
      tray.innerHTML = '<span class="t">Parts used</span><span class="s"></span>';
    }
    this.el.tray = tray;
    this.el.trayS = tray.querySelector(".s");
    rail.appendChild(tray);

    rail.appendChild(this.btn("to_menu", "Main Menu", "back", "", () => game._handle_menu("to_menu")));
    // A rebuilt rail is a different width and starts at scrollLeft 0, so the fade has
    // to be re-decided here as well as on scroll.
    rail.scrollLeft = 0;
    if (this._syncFade) this._syncFade();
    this._needRect = true;
  },

  buildHint(game) {
    const h = this.el.hint;
    const rows = game.mode === "puzzle"
      ? [["Drag", "seat a gear"], ["Scroll / pinch", "zoom"], ["Restart", "reset the level"]]
      : [["Tap a gear", "make it the motor"], ["Drag", "move &amp; mesh"],
         ["Drop on centre", "stack a shaft"], ["Drop on rail", "scrap"], ["Scroll / pinch", "zoom"]];
    h.innerHTML = rows.map(([k, v]) => '<span class="h"><kbd>' + k + "</kbd>" + v + "</span>").join("");
  },

  // ---------------- per-frame sync ----------------
  sync(game) {
    const mode = game.mode;
    // The rail's button list is identical on every level, so keying the rebuild on
    // it alone left the objective panel showing level 1 for the whole campaign.
    const railKey = game.menu.ids() + "|" + (mode === "puzzle" ? game.level_idx : "");
    if (mode !== this._mode || (railKey !== this._railKey && mode !== "menu")) {
      this._mode = mode;
      this._railKey = railKey;
      this.el.body.dataset.mode = mode;
      this.el.title.classList.toggle("on", mode === "menu");
      if (mode !== "menu") { this.buildTop(game); this.buildRail(game); this.buildHint(game); }
    }
    if (mode === "menu") { this.syncWin(game); return; }

    const m = this.el.m;
    if (mode === "puzzle") {
      const lv = LEVELS[game.level_idx];
      this.set(this.el.lvchip, "Level " + (game.level_idx + 1));
      this.set(this.el.lvname, lv.name);
      const driven = game.tile_list.filter((t) => t.role === "driven");
      const on = driven.filter((t) => game.target_ok(t)).length;
      this.set(m.targets, on + " / " + driven.length);
      m.targets.className = "v " + (driven.length && on === driven.length ? "" : "cyan");
      if (driven.length && on === driven.length) m.targets.style.color = "var(--green)";
      else m.targets.style.color = "";
      this.set(m.mesh, String(game.mesh_edges.length));
      this.set(m.zoom, game.zoom.toFixed(2) + "×");
      // Against par, not against the tray: the tray holds spares, and "3 / 5" would
      // read as an instruction to use all five.
      if (this.el.trayS) {
        this.set(this.el.trayS, game.parts_used() + " / " + game.par());
        this.el.trayS.classList.toggle("over", game.parts_used() > game.par());
      }
      if (this.el.r && this.el.r.targets) {
        this.set(this.el.r.targets, on + " / " + driven.length);
        this.el.r.targets.classList.toggle("done", !!driven.length && on === driven.length);
      }
      if (this.el.r && this.el.r.readout) this.set(this.el.r.readout, READOUT_LABEL[game.readout_mode]);
      if (this.el.r && this.el.r.scope) this.set(this.el.r.scope, SCOPE_LABEL[game.readout_scope]);
      if (this.el.r && this.el.r.goals) {
        for (const g of this.el.r.goals) g.el.classList.toggle("done", game.target_ok(g.tile));
      }
    } else {
      this.set(m.status, game.paused ? "PAUSED" : "RUNNING");
      this.el.lamp.classList.toggle("hold", game.paused);
      const ps = game.paused ? "1" : "0";
      if (this.el.body.dataset.paused !== ps) this.el.body.dataset.paused = ps;
      const d = game.selected_driver;
      const rpm = d ? omega_to_rpm(d.drive_speed) : 0;
      this.set(m.motor, d ? (rpm >= 0 ? "+" : "") + rpm.toFixed(0) : "—");
      this.set(m.parts, String(game.tile_list.length));
      this.set(m.drivers, String(game.tile_list.filter((t) => t.is_driver).length));
      this.set(m.mesh, String(game.mesh_edges.length));
      this.set(m.damp, DAMPING.name);
      this.set(m.zoom, game.zoom.toFixed(2) + "×");
      const r = this.el.r;
      if (r.rpm) {
        const txt = d ? (rpm >= 0 ? "+" : "") + rpm.toFixed(0) : "—";
        if (this._txt.get(r.rpm) !== txt) {
          this.set(r.rpm, txt);
          r.rpm.classList.remove("flash");
          void r.rpm.offsetWidth;              // restart the keyframe
          r.rpm.classList.add("flash");
        }
      }
      if (r.readout) this.set(r.readout, READOUT_LABEL[game.readout_mode]);
      if (r.scope) this.set(r.scope, SCOPE_LABEL[game.readout_scope]);
      if (r.damp) {
        this.set(r.damp, DAMPING.short);
        const b = r.damp.parentElement;
        if (b) b.setAttribute("aria-pressed", DAMP_MODE ? "true" : "false");
      }
      if (r.pause) {
        const lbl = game.paused ? "Run" : "Pause";
        this.set(r.pause.querySelector(".lbl"), lbl);
        // paused is a held state shown by the status lamp and the bar; the button
        // itself becomes the primary action to get moving again
        r.pause.classList.toggle("primary", game.paused);
        const want = game.paused ? ICO.play : ICO.pause;
        if (r.pause._ico !== want) { r.pause._ico = want; r.pause.querySelector("svg").innerHTML = want; }
      }
      if (this.el.tray) this.el.tray.classList.toggle("armed",
        !!(game.dragging && game.drag_tile && game.menu.contains(game._dragUI0, game._dragUI1)));
    }
    this.syncWin(game);
    if (this._needRect) this.measure(game);
  },

  // Publish the rail's screen rect back to the game so drop-to-scrap keeps working.
  measure(game) {
    this._needRect = false;
    const el = this.el.rail;
    // offset* is the laid-out box; getBoundingClientRect would fold in the
    // entrance transform and leave the drop zone a few pixels off.
    const w = el.offsetWidth, h = el.offsetHeight;
    if (!w || !h) { this._needRect = true; return; }
    game.menu.set_rect(el.offsetLeft, game.H - (el.offsetTop + h), w, h);
  },
};

// Expose for headless testing
if (typeof globalThis !== "undefined") globalThis.__GW = { Game, G, tri_to_screen, rpm_to_omega, omega_to_rpm, LEVELS, readouts: _roPlaced, chips: _chipBoxes, alloy_for,
                                                LEVEL_BOX, SPRING_MAX_WIND, WIN_REVEAL_DELAY };

// ============================================================
// Browser boot
// ============================================================
if (typeof document !== "undefined" && document.getElementById) {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1, game = null;

  function resize() {
    dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    W = window.innerWidth; H = window.innerHeight;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!game) {
      game = new Game(W, H);
      globalThis.__GW.game = game;
      CHROME.init(game);
    } else {
      game.set_size(W, H);
      CHROME._needRect = true;
    }
  }
  function sp(clientX, clientY) {      // client -> canvas CSS px (y-down)
    const r = canvas.getBoundingClientRect();
    return [clientX - r.left, clientY - r.top];
  }

  // ----- mouse -----
  function mdown(e) { e.preventDefault(); const c = sp(e.clientX, e.clientY); game.pointer_down(c[0], c[1]); }
  // Cursor affordance: the arena is a precision surface (crosshair), parts are
  // grabbable, anchored level parts are not. Only ever written when it changes.
  let _cursor = "";
  function setCursor(v) { if (v !== _cursor) { _cursor = v; canvas.style.cursor = v; } }
  function mmove(e) {
    const c = sp(e.clientX, e.clientY);
    game.pointer_move(c[0], c[1]);
    if (game.dragging) { setCursor("grabbing"); return; }
    if (game.mode === "menu" || game.win) { setCursor("default"); return; }
    const t = game._pick_tile(game.screen_to_world(c[0], c[1]));
    setCursor(!t ? "crosshair" : (t.anchored ? "not-allowed" : "grab"));
  }
  function mup(e)   { const c = sp(e.clientX, e.clientY); game.pointer_up(c[0], c[1]); setCursor(""); }
  canvas.addEventListener("mousedown", mdown);
  // on window, not the canvas: a drag that crosses the chrome layer (e.g. on its
  // way to the scrap tray) must keep tracking the part
  window.addEventListener("mousemove", mmove);
  window.addEventListener("mouseup", mup);

  // ----- mouse-wheel zoom (about the cursor) -----
  canvas.addEventListener("wheel", (e) => {
    if (game.mode === "menu") return;
    e.preventDefault();
    const c = sp(e.clientX, e.clientY);
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    game.zoom_at(c[0], c[1], factor);
  }, { passive: false });

  // ----- touch: 1 finger = drag, 2 fingers = pinch-zoom + pan -----
  let pinch = null, suppressDrag = false;
  function pinchState(e) {
    const a = sp(e.touches[0].clientX, e.touches[0].clientY);
    const b = sp(e.touches[1].clientX, e.touches[1].clientY);
    return { dist: Math.hypot(a[0]-b[0], a[1]-b[1]), mx: (a[0]+b[0])/2, my: (a[1]+b[1])/2 };
  }
  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (e.touches.length >= 2) { suppressDrag = true; game.cancel_drag(); pinch = pinchState(e); }
    else if (e.touches.length === 1 && !suppressDrag) { const c = sp(e.touches[0].clientX, e.touches[0].clientY); game.pointer_down(c[0], c[1]); }
  }, { passive: false });
  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (e.touches.length >= 2 && pinch && game.mode !== "menu") {
      const p = pinchState(e);
      if (p.dist > 0 && pinch.dist > 0) game.zoom_at(p.mx, p.my, p.dist / pinch.dist);
      game.pan_by(p.mx - pinch.mx, p.my - pinch.my);
      pinch = p;
    } else if (e.touches.length === 1 && !suppressDrag) {
      const c = sp(e.touches[0].clientX, e.touches[0].clientY); game.pointer_move(c[0], c[1]);
    }
  }, { passive: false });
  function touchend(e) {
    e.preventDefault();
    if (e.touches.length < 2) pinch = null;
    if (e.touches.length === 0) {
      const c = sp(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      game.pointer_up(c[0], c[1]);
      suppressDrag = false;
    }
  }
  canvas.addEventListener("touchend", touchend, { passive: false });
  canvas.addEventListener("touchcancel", touchend, { passive: false });

  window.addEventListener("resize", resize);

  resize();
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // base transform each frame; draw() adds the camera
    G.setCanvas(ctx, W, H);
    game.draw();
  }
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
    if (globalThis.__GW.auto) { game.update(dt); render(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Headless harness hooks: pause the rAF loop and advance a fixed number of
  // fixed-dt frames, so screenshots and regression runs are deterministic.
  globalThis.__GW.auto = true;
  globalThis.__GW.render = render;
  globalThis.__GW.step = function (n, dt) {
    n = n || 30; dt = dt || 1 / 60;
    // update-then-render per frame, exactly like the rAF loop: anything that reads
    // the chrome's state, or that the chrome reads back, has to see the same
    // interleaving headless that it sees in a browser.
    for (let i = 0; i < n; i++) { game.update(dt); render(); }
  };
}

})();
</script>
</body>
</html>
