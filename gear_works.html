// hex -> {r,g,b} 0..255, memoised (draw path must not allocate per frame)
const _hexCache = new Map();
function hexRGB(hex) {
  let v = _hexCache.get(hex);
  if (v) return v;
  const n = parseInt(hex.slice(1), 16);
  v = { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  _hexCache.set(hex, v);
  return v;
}
const _rgbaCache = new Map();
// "#RRGGBB" + alpha -> css rgba() string, memoised
function ca(hex, a) {
  const key = a === undefined ? hex : hex + "|" + a;
  let s = _rgbaCache.get(key);
  if (s) return s;
  const c = hexRGB(hex);
  s = a === undefined || a >= 1 ? hex : "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
  _rgbaCache.set(key, s);
  return s;
}
// Multiply a hex toward black/white — the machined facet derivation.
const _shadeCache = new Map();
function shadeHex(hex, mult) {
  const key = hex + "*" + mult;
  let s = _shadeCache.get(key);
  if (s) return s;
  const c = hexRGB(hex);
  const f = (x) => Math.max(0, Math.min(255, Math.round(x * mult))) | 0;
  s = "#" + ((1 << 24) + (f(c.r) << 16) + (f(c.g) << 8) + f(c.b)).toString(16).slice(1);
  _shadeCache.set(key, s);
  return s;
}
// Lift a hex toward white by t (0..1) — used for the specular sweep.
const _liftCache = new Map();
function liftHex(hex, t) {
  const key = hex + "+" + t;
  let s = _liftCache.get(key);
  if (s) return s;
  const c = hexRGB(hex);
  const f = (x) => Math.round(x + (255 - x) * t) | 0;
  s = "#" + ((1 << 24) + (f(c.r) << 16) + (f(c.g) << 8) + f(c.b)).toString(16).slice(1);
  _liftCache.set(key, s);
  return s;
}

const FONT = T.fontSans;
const RPM_FONT_SIZE = 12;
// Torque readout. Sim units are arbitrary but consistent, scaled to a friendly
// range; shows how torque trades off against speed across a train.
function fmt_torque(t) {
  const v = Math.abs(t) * TORQUE_DISPLAY_SCALE;
  if (v < 0.05) return "0 N\u00b7m";
  if (v < 10) return v.toFixed(1) + " N\u00b7m";
  return Math.round(v) + " N\u00b7m";
}

// Gear body colours, coded by size (U1 triangle, U2 small hex, U3 big hex)
const COLOR_U1 = [0.50, 0.34, 0.62];  // violet
const COLOR_U2 = [0.20, 0.52, 0.50];  // teal
const COLOR_U3 = [0.66, 0.44, 0.26];  // bronze
const COLOR_U4 = [0.64, 0.30, 0.40];  // crimson
const COLOR_U5 = [0.34, 0.40, 0.68];  // indigo
const COLOR_SP = [0.24, 0.46, 0.30];  // spring: green

// --- Spring gears ---
// A spring gear stores energy as it turns from rest: torque = -SPRING_K * wind.
// Winding it up fights back with increasing torque; released, it unwinds the
// other way with decreasing torque as the wind returns to zero.
const SPRING_K = 6.0;                          // torque per radian of wind
const SPRING_DAMP = 12.0;                      // internal loss, so an unwind settles

// --- Damping profiles (switchable at runtime with the "Damp:" button) ---
// "Normal" is the default game feel. "Clock" nearly removes all loss so a wound
// spring rings like a clock/hairspring. "None" is fully lossless: with the
// symplectic integrator the swing is bounded and persists indefinitely.
//   viscous  = baseline drag on every train (was OMEGA_DAMP)
//   friction = per-gear rotational friction (was FRICTION_B_PER_GEAR)
//   spring   = internal loss inside spring gears (was SPRING_DAMP)
const DAMP_PRESETS = [
  { name: "Normal", short: "Norm",  viscous: 0.4,  friction: 0.020,  spring: 12.0, coast: 1.80 },
  { name: "Clock",  short: "Clock", viscous: 0.01, friction: 0.0005, spring: 0.02, coast: 0.02 },
  { name: "None",   short: "None",  viscous: 0.0,  friction: 0.0,    spring: 0.0,  coast: 0.0  },
];
let DAMP_MODE = 0;
let DAMPING = DAMP_PRESETS[0];
const SPRING_MAX_WIND = 6.0 * (Math.PI * 2);   // hard stop ("fully wound"), radians
const SPRING_TURNS_MIN = 1.2;         // spiral turns drawn at rest
const SPRING_TURNS_MAX = 4.0;         // spiral turns drawn when fully wound

// --- Racks (linear sliding elements) ---
// A rack is a toothed bar. Meshed with a pinion of pitch radius r it obeys
// v = +/- r*omega, so it joins the ratio graph as a node whose "omega" is a LINEAR
// speed (px/s) and whose inertia is a plain mass. Travel limits act as hard stops.
const COLOR_RACK = [0.40, 0.42, 0.48];
// --- Ring (annulus) gear: teeth on BOTH the inner and outer pitch circles ---
// The inner pitch circle drives planets (internal mesh, same spin direction); the
// outer pitch circle meshes external gears normally. Its "pitch_r" for external
// meshing is the OUTER pitch radius; internal meshing uses inner_r().
const COLOR_RING = [0.30, 0.50, 0.44];
const RING_INNER_MULT = 4.0;     // inner pitch radius = Rp2 * this  (so sun+2*planet closes)
const RING_RIM_MULT   = 1.5;     // rim thickness (inner pitch -> outer pitch) = Rp2 * this
const RACK_MASS = 0.002;         // reflected to the train as mass * k^2  (k in px/rad)
const RACK_FRIC = 0.00002;       // linear friction, reflected as b * k^2
const RACK_LEN_MULT = 9.0;       // bar length = step * this

// --- Linkages (crank + rod driving a slider) ---
// Nonlinear position constraints don't fit the linear ratio solver, so a linkage is
// solved KINEMATICALLY in closed form each frame: the gear's rotation drives the
// slider. The linked rack becomes kinematic (it leaves the dynamics graph).
const LINK_PIN_MULT = 0.62;      // crank pin radius as a fraction of the gear pitch radius
const COLOR_ROD = [0.85, 0.72, 0.35];

// Hex gear sizes: radius = base step * mult. (U1 = triangle, handled separately.)
const HEX_MULT  = { U2: 1.0, U3: 1.5, U4: 2.0, U5: 2.5, SP: 1.5 };
const HEX_COLOR = { U2: COLOR_U2, U3: COLOR_U3, U4: COLOR_U4, U5: COLOR_U5, SP: COLOR_SP };

// ============================================================
// Game / puzzle content
// ============================================================
const GAME_TITLE = "GEAR WORKS";
const WIN_SPIN_EPS = 1e-2;

// Level schema (free-position / pitch-snap world):
//   drives/driven: [{ pos:[x,y], ... }]  positions in units of Rp2 (the U2 pitch
//     radius) from the arena centre. Gaps are chosen so a straight tangent chain of

//   inventory: [type...]  gears dropped into the arena for the player to snap in.
//   Win = every driven gear turning.
//   Tangent gaps (centre-to-centre, in Rp2): U2-U2 = 2, U3-U2 = 2.5, U2-U1 = 1.5.
const LEVELS = [
  { name: "First Link",
    hint: "Drag the gear so it meshes the drive and the target.",
    inventory: ["U2"],
    drives: [{ pos: [-2, 0], rpm: 120, type: "U2" }],
    driven: [{ pos: [2, 0], type: "U2" }] },
  { name: "Straight Run",
    hint: "Snap the 3 gears into a chain across the gap.",
    inventory: ["U2", "U2", "U2"],
    drives: [{ pos: [-4, 0], rpm: 120, type: "U2" }],
    driven: [{ pos: [4, 0], type: "U2" }] },
  { name: "Double Duty",
    hint: "Two drives, two targets. Bridge both — two gears each.",
    inventory: ["U2", "U2", "U2", "U2"],
    drives: [{ pos: [-3, 3.2], rpm: 120, type: "U2" }, { pos: [-3, -3.2], rpm: 150, type: "U2" }],

  { name: "The Full Set",
